<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cash Flow OS</title>
  <style>
    :root {
      --nb-bg: #FAF8F5;
      --nb-surface: #FFFFFF;
      --nb-ink: #111111;
      --nb-muted: #666666;
      --nb-yellow: #FFD426;
      --nb-green: #22C55E;
      --nb-pink: #FB7185;
      --nb-purple: #818CF8;
      --nb-amber: #FCD34D;
      --nb-border: 2px solid #111111;
      --nb-shadow: 4px 4px 0px #111111;
      --nb-shadow-sm: 3px 3px 0px #111111;

      --bg: var(--nb-bg);
      --surface: var(--nb-surface);
      --fg: var(--nb-ink);
      --fg-dim: var(--nb-muted);
      --credit: #16A34A;
      --debit: #DC2626;
      --warn: #B45309;
      --split: #6D28D9;
      --owe: #C2410C;
      --info: #0369A1;
      --font-main: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    body[data-ui="terminal"] {
      --bg: #040705;
      --surface: #08100b;
      --fg: #00ff66;
      --fg-dim: #00b347;
      --credit: #00ffcc;
      --debit: #ff5c5c;
      --warn: #ffcc00;
      --split: #c792ea;
      --owe: #ff9e64;
      --info: #56b6c2;
      --font-main: 'JetBrains Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100dvh; background: var(--bg); color: var(--fg);
      font-family: var(--font-main); font-size: 14px; line-height: 1.4; overflow: hidden;
    }

    body[data-ui="terminal"]::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.28) 50%);
      background-size: 100% 3px;
    }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed; inset: 0; z-index: 9999; background: var(--nb-bg); color: var(--nb-ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    #lock-screen.unlocked { display: none; }
    body[data-ui="terminal"] #lock-screen { background: #040705; color: #00ff66; font-family: var(--font-mono); }

    .lock-card {
      width: 100%; max-width: 310px; background: var(--nb-surface);
      border: var(--nb-border); border-radius: 16px; box-shadow: var(--nb-shadow);
      padding: 20px 16px; text-align: center;
    }
    body[data-ui="terminal"] .lock-card { background: #08100b; border: 1px solid #00ff66; box-shadow: none; border-radius: 6px; }
    .lock-badge {
      display: inline-block; background: var(--nb-yellow); color: #111111;
      border: var(--nb-border); border-radius: 8px; padding: 3px 10px;
      font-size: 11px; font-weight: 800; margin-bottom: 8px;
    }
    body[data-ui="terminal"] .lock-badge { background: #00ff66; color: #040705; border: none; border-radius: 4px; }
    .lock-title { font-size: 19px; font-weight: 800; margin-bottom: 3px; }
    .lock-sub { font-size: 12px; color: var(--fg-dim); margin-bottom: 14px; }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
    .pin-dot { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 50%; }
    .pin-dot.filled { background: currentColor; }
    .lock-err { font-size: 12px; color: var(--debit); font-weight: 700; min-height: 18px; margin-bottom: 6px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .k-btn {
      height: 46px; background: var(--nb-surface); color: var(--nb-ink);
      border: var(--nb-border); border-radius: 10px; box-shadow: var(--nb-shadow-sm);
      font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit;
    }
    .k-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #111111; }
    .k-btn.yellow { background: var(--nb-yellow); }
    .k-btn.green { background: var(--nb-green); }
    body[data-ui="terminal"] .k-btn { background: #0d1a12; color: #00ff66; border: 1px solid #193823; box-shadow: none; border-radius: 4px; }
        #app {
      display: flex; flex-direction: column; height: 100dvh; max-width: 960px;
      margin: 0 auto; padding: 10px 14px 10px;
    }

    /* TOP BAR */
    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 8px; flex-shrink: 0;
    }
    .brand-tag { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .top-controls { display: flex; gap: 6px; align-items: center; }
    .nb-pill {
      height: 30px; padding: 0 10px; background: var(--nb-surface); color: var(--nb-ink);
      border: var(--nb-border); border-radius: 999px;
      font-weight: 800; font-size: 11px; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .nb-pill.dark { background: #1A1A1A; color: #FFFFFF; }
    body[data-ui="terminal"] .nb-pill {
      background: #08100b; color: #00ff66; border: 1px solid #00b347; border-radius: 4px;
    }

    /* CENTER WALLET LOGO BADGE */
    #logo-wrap {
      display: flex; justify-content: center; margin-bottom: 8px; flex-shrink: 0;
    }
    body[data-ui="terminal"] #logo-wrap { display: none; }
    .wallet-badge {
      width: 44px; height: 44px; background: #1A1A1A; border: var(--nb-border);
      border-radius: 12px; box-shadow: var(--nb-shadow-sm);
      display: flex; align-items: center; justify-content: center; padding: 6px;
    }

    /* FOLDER-TAB GRID */
    #nb-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      margin-bottom: 10px; flex-shrink: 0;
    }
    body[data-ui="terminal"] #nb-grid { display: none; }

    .folder-card-wrap { display: flex; flex-direction: column; cursor: pointer; }
    .folder-tab {
      width: 52px; height: 8px; border: var(--nb-border); border-bottom: none;
      border-radius: 6px 6px 0 0;
    }
    .folder-body {
      background: var(--nb-surface); border: var(--nb-border);
      border-radius: 0 12px 12px 12px; box-shadow: var(--nb-shadow);
      padding: 8px 10px; display: flex; align-items: center; gap: 8px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .folder-card-wrap:active .folder-body {
      transform: translate(2px, 2px); box-shadow: 1px 1px 0px #111111;
    }
    .folder-icon { font-size: 15px; font-weight: 800; color: var(--nb-ink); }
    .folder-info { display: flex; flex-direction: column; min-width: 0; }
    .folder-title { font-size: 13px; font-weight: 800; color: var(--nb-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-meta { font-size: 10.5px; color: var(--nb-muted); font-weight: 600; }

    /* MAIN OUTPUT CARD (MATCHING REFERENCE UI) */
    #feed-card {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
      background: var(--nb-surface); border: var(--nb-border);
      border-radius: 16px; box-shadow: var(--nb-shadow); padding: 12px 14px 10px;
      overflow: hidden;
    }
    body[data-ui="terminal"] #feed-card {
      background: transparent; border: none; box-shadow: none; padding: 0; border-radius: 0;
    }

    #feed-card-header {
      text-align: center; font-size: 14px; font-weight: 800; color: var(--nb-ink);
      padding-bottom: 8px; border-bottom: 1.5px solid #ECEAE4; margin-bottom: 6px; flex-shrink: 0;
    }
    body[data-ui="terminal"] #feed-card-header { display: none; }

    #output {
      flex: 1; overflow-y: auto; padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    /* STRUCTURED FEED ROWS */
    .tx-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 2px; border-bottom: 1px solid #F0EEE9;
    }
    body[data-ui="terminal"] .tx-row { border-bottom: 1px dashed #193823; }
    .tx-left { display: flex; flex-direction: column; min-width: 0; padding-right: 8px; }
    .tx-title { font-size: 14px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-sub { font-size: 11px; color: var(--fg-dim); font-weight: 500; }
    .tx-right { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
    .tx-amt { font-size: 14px; font-weight: 800; }
    .tx-cat { font-size: 11px; color: var(--fg-dim); font-weight: 600; }

    .line { margin-bottom: 5px; white-space: pre-wrap; word-break: break-word; font-weight: 600; font-size: 13px; }
    .cmd-echo { font-weight: 800; color: var(--fg); margin-top: 6px; }
    .dim { color: var(--fg-dim); }
    .credit { color: var(--credit); }
    .debit { color: var(--debit); }
    .warn { color: var(--warn); }
    .split { color: var(--split); }
    .owe { color: var(--owe); }
    .info { color: var(--info); }

    .box-block {
      background: #FAF8F5; border: 1.5px solid #111111; border-radius: 10px;
      padding: 10px; margin: 8px 0; white-space: pre; overflow-x: auto;
      font-family: var(--font-mono); font-size: 11.5px; color: #111111;
    }
    body[data-ui="terminal"] .box-block {
      background: transparent; border: none; padding: 4px 0; color: #00ff66;
    }

    /* CARD FOOTER TOTAL */
    #feed-card-footer {
      display: flex; flex-direction: column; align-items: flex-end;
      padding-top: 8px; border-top: 1.5px solid #ECEAE4; margin-top: 4px; flex-shrink: 0;
    }
    body[data-ui="terminal"] #feed-card-footer { display: none; }
    .footer-total { font-size: 15px; font-weight: 800; color: var(--nb-ink); }
    .footer-sub { font-size: 10.5px; color: var(--nb-muted); font-weight: 600; }

    /* QUICK ACTION CHIPS */
    #chips-row {
      display: flex; gap: 7px; overflow-x: auto; margin-top: 9px; padding-bottom: 2px;
      scrollbar-width: none; flex-shrink: 0;
    }
    #chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--nb-surface); color: var(--nb-ink); border: var(--nb-border);
      border-radius: 999px; box-shadow: 2px 2px 0px #111111; padding: 5px 12px;
      font-size: 11.5px; font-weight: 800; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .chip.yellow { background: var(--nb-yellow); }
    .chip:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #111111; }
    body[data-ui="terminal"] .chip {
      background: #0d1a12; color: #00ff66; border: 1px solid #193823;
      border-radius: 4px; box-shadow: none;
    }

    /* BOTTOM INPUT BAR */
    #bottom-input-area { margin-top: 8px; flex-shrink: 0; }
    .nb-input-wrap { display: flex; gap: 8px; align-items: center; }
    .nb-input-box {
      flex: 1; display: flex; align-items: center; gap: 6px;
      background: var(--nb-surface); border: var(--nb-border);
      border-radius: 999px; box-shadow: var(--nb-shadow); padding: 0 8px 0 14px; height: 46px;
    }
    .nb-hash { font-weight: 800; font-size: 13px; color: var(--nb-ink); white-space: nowrap; }
    body:not([data-ui="terminal"]) .nb-hash { display: none; }
    #cmd-input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 14px; font-weight: 600; color: var(--nb-ink); min-width: 30px;
    }
    #cmd-input::placeholder { color: var(--nb-muted); font-weight: 500; }

    #mic-btn {
      width: 32px; height: 32px; border-radius: 50%; background: var(--nb-yellow);
      border: 1.5px solid #111111; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn.listening { background: #FB7185; transform: scale(1.1); }

    #submit-btn {
      width: 46px; height: 46px; background: var(--nb-yellow); color: var(--nb-ink);
      border: var(--nb-border); border-radius: 50%; box-shadow: var(--nb-shadow);
      font-size: 22px; font-weight: 800; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #submit-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #111111; }

    body[data-ui="terminal"] .nb-input-box {
      background: transparent; border: none; box-shadow: none; padding: 0; height: 36px; border-radius: 0;
    }
    body[data-ui="terminal"] #cmd-input { color: #00ff66; font-family: var(--font-mono); }
    body[data-ui="terminal"] #mic-btn { background: #0d1a12; border: 1px solid #00ff66; color: #00ff66; }
    body[data-ui="terminal"] #submit-btn {
      width: auto; padding: 0 12px; height: 34px; background: #00ff66; color: #040705;
      border: none; box-shadow: none; border-radius: 4px; font-size: 12px; font-family: var(--font-mono);
    }
  </style>
</head>
<body data-ui="neobrutal">
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-badge">LOCKED</div>
      <div class="lock-title" id="lock-heading">Unlock Cash Flow</div>
      <div class="lock-sub" id="lock-sub">Enter PIN or Use Fingerprint</div>
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span>
        <span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <div class="lock-err" id="lock-err"></div>
      <div class="keypad">
        <button type="button" class="k-btn" data-key="1">1</button>
        <button type="button" class="k-btn" data-key="2">2</button>
        <button type="button" class="k-btn" data-key="3">3</button>
        <button type="button" class="k-btn" data-key="4">4</button>
        <button type="button" class="k-btn" data-key="5">5</button>
        <button type="button" class="k-btn" data-key="6">6</button>
        <button type="button" class="k-btn" data-key="7">7</button>
        <button type="button" class="k-btn" data-key="8">8</button>
        <button type="button" class="k-btn" data-key="9">9</button>
        <button type="button" class="k-btn green" id="btn-biometric">FP</button>
        <button type="button" class="k-btn" data-key="0">0</button>
        <button type="button" class="k-btn yellow" id="pin-back">⌫</button>
      </div>
    </div>
  </div>

  <div id="app">
    <div id="top-bar">
      <span class="brand-tag">Cash Flow OS</span>
      <div class="top-controls">
        <button type="button" class="nb-pill" id="mask-toggle">HIDE</button>
        <button type="button" class="nb-pill" id="ui-toggle">UI</button>
        <button type="button" class="nb-pill dark" id="bal-badge">₹0</button>
      </div>
    </div>

    <div id="logo-wrap">
      <div class="wallet-badge">
        <svg viewBox="0 0 64 64" width="30" height="30">
          <rect x="6" y="6" width="52" height="52" rx="12" fill="#E6E4DF"/>
          <rect x="10" y="10" width="44" height="14" rx="4" fill="#2997D8"/>
          <rect x="10" y="17" width="44" height="14" rx="4" fill="#F5B027"/>
          <rect x="10" y="24" width="44" height="14" rx="4" fill="#48B84B"/>
          <rect x="10" y="31" width="44" height="16" rx="4" fill="#EB6E5C"/>
          <path d="M6,38 H22 C25,38 27,45 32,45 C37,45 39,38 42,38 H58 V50 C58,54.4 54.4,58 50,58 H14 C9.6,58 6,54.4 6,50 Z" fill="#E6E4DF"/>
        </svg>
      </div>
    </div>

    <div id="nb-grid"></div>

    <div id="feed-card">
      <div id="feed-card-header">Transaction Feed &amp; Output</div>
      <div id="output" aria-live="polite"></div>
      <div id="feed-card-footer">
        <div class="footer-total" id="footer-total-val">Total: ₹0</div>
        <div class="footer-sub">Total net balance</div>
      </div>
    </div>

    <div id="chips-row">
      <button type="button" class="chip" data-cmd="bal">Balance</button>
      <button type="button" class="chip" data-cmd="dues">Udhar</button>
      <button type="button" class="chip" data-cmd="ls">History</button>
      <button type="button" class="chip" data-cmd="edit">Edit Last</button>
      <button type="button" class="chip" data-insert="find ">Search</button>
      <button type="button" class="chip" data-insert=" with ">+with</button>
      <button type="button" class="chip" data-insert=" paid by ">+paid by</button>
      <button type="button" class="chip yellow" data-cmd="clear">Clear</button>
    </div>

    <div id="bottom-input-area">
      <div class="nb-input-wrap">
        <div class="nb-input-box">
          <span class="nb-hash" id="prompt-text">user@cashflow:~$</span>
          <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="50 chai upi | 200 pizza with sachin" />
          <button type="button" id="mic-btn" title="Voice Input">🎤</button>
        </div>
        <button type="button" id="submit-btn" aria-label="Send">+</button>
      </div>
    </div>
  </div>
    <script>
    const outputEl = document.getElementById('output');
    const cmdInput = document.getElementById('cmd-input');
    const submitBtn = document.getElementById('submit-btn');
    const micBtn = document.getElementById('mic-btn');
    const uiToggle = document.getElementById('ui-toggle');
    const maskToggle = document.getElementById('mask-toggle');
    const balBadge = document.getElementById('bal-badge');
    const footerTotalVal = document.getElementById('footer-total-val');
    const nbGrid = document.getElementById('nb-grid');

    const lockScreen = document.getElementById('lock-screen');
    const lockHeading = document.getElementById('lock-heading');
    const lockSub = document.getElementById('lock-sub');
    const lockErr = document.getElementById('lock-err');
    const pinDots = document.querySelectorAll('#pin-dots .pin-dot');

    const L1_PRIMARY_KEY = 'cashflow_os_v5_primary';
    const L1_BACKUP_KEY  = 'cashflow_os_v5_backup';
    const IDB_DB_NAME    = 'CASHFLOW_OS_IDB_V5';
    const IDB_STORE_NAME = 'ledger_snapshots';
    const UI_PREF_KEY    = 'cashflow_os_ui_mode_v2';
    const MASK_PREF_KEY  = 'cashflow_os_masked_v1';
    const PIN_KEY        = 'cashflow_os_pin_v1';
    const LAST_BKP_KEY   = 'cashflow_os_last_auto_backup';

    // --- BIOMETRIC & PIN LOCK ---
    let pinBuffer = '', isSettingPin = false, tempFirstPin = '';

    function getSavedPin() {
      try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; }
    }
    function updatePinDots() {
      pinDots.forEach((d, i) => d.classList.toggle('filled', i < pinBuffer.length));
    }
    function unlockApp() {
      pinBuffer = ''; tempFirstPin = ''; updatePinDots();
      lockScreen.classList.add('unlocked');
    }
    window.onNativeUnlock = unlockApp;

    function triggerBiometricPrompt() {
      try {
        if (window.AndroidNative && typeof window.AndroidNative.triggerBiometric === 'function') {
          window.AndroidNative.triggerBiometric();
        } else {
          lockErr.textContent = 'Fingerprint available in Android APK';
        }
      } catch (e) {}
    }

    function engageLock() {
      pinBuffer = ''; tempFirstPin = ''; lockErr.textContent = '';
      if (!getSavedPin()) {
        isSettingPin = true;
        lockHeading.textContent = 'Create 4-Digit PIN';
        lockSub.textContent = 'Set backup PIN for Cash Flow OS';
      } else {
        isSettingPin = false;
        lockHeading.textContent = 'Unlock Cash Flow';
        lockSub.textContent = 'Enter PIN or tap FP for Fingerprint';
      }
      updatePinDots();
      lockScreen.classList.remove('unlocked');
      cmdInput.blur();
      if (!isSettingPin) setTimeout(triggerBiometricPrompt, 200);
    }

    document.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => {
      if (pinBuffer.length >= 4) return;
      pinBuffer += b.getAttribute('data-key');
      lockErr.textContent = '';
      updatePinDots();
      if (pinBuffer.length === 4) {
        setTimeout(() => {
          if (isSettingPin) {
            if (!tempFirstPin) {
              tempFirstPin = pinBuffer; pinBuffer = ''; updatePinDots();
              lockHeading.textContent = 'Confirm PIN'; lockSub.textContent = 'Re-enter 4-digit PIN';
            } else if (pinBuffer === tempFirstPin) {
              try { localStorage.setItem(PIN_KEY, pinBuffer); } catch (e) {}
              unlockApp();
            } else {
              lockErr.textContent = 'PINs did not match'; tempFirstPin = ''; pinBuffer = ''; updatePinDots();
              lockHeading.textContent = 'Create 4-Digit PIN';
            }
          } else if (pinBuffer === getSavedPin()) {
            unlockApp();
          } else {
            lockErr.textContent = 'Wrong PIN'; pinBuffer = ''; updatePinDots();
          }
        }, 80);
      }
    }));

    document.getElementById('btn-biometric').addEventListener('click', triggerBiometricPrompt);
    document.getElementById('pin-back').addEventListener('click', () => {
      pinBuffer = pinBuffer.slice(0, -1); lockErr.textContent = ''; updatePinDots();
    });

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') engageLock(); });
    window.addEventListener('pagehide', engageLock);
    engageLock();

    // --- VOICE TO TEXT ---
    window.onVoiceResult = function(spokenText) {
      micBtn.classList.remove('listening');
      cmdInput.value = spokenText;
      cmdInput.focus();
    };
    window.onVoiceError = function() {
      micBtn.classList.remove('listening');
      printLine('[VOICE] Mic sun nahi paya, dubara try karein.', 'warn');
    };

    micBtn.addEventListener('click', () => {
      micBtn.classList.add('listening');
      if (window.AndroidNative && typeof window.AndroidNative.startVoiceInput === 'function') {
        window.AndroidNative.startVoiceInput();
      } else if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'en-IN';
        rec.onresult = (e) => window.onVoiceResult(e.results[0][0].transcript);
        rec.onerror = () => window.onVoiceError();
        rec.start();
      } else {
        micBtn.classList.remove('listening');
        printLine('[VOICE] Voice input is device par supported nahi hai.', 'warn');
      }
    });

    // --- MASK & UI SWITCHER ---
    let isMasked = false;
    try { isMasked = localStorage.getItem(MASK_PREF_KEY) === '1'; } catch (e) {}
    maskToggle.textContent = isMasked ? 'SHOW' : 'HIDE';
    maskToggle.addEventListener('click', () => {
      isMasked = !isMasked;

      maskToggle.textContent = isMasked ? 'SHOW' : 'HIDE';
      renderFolderCards();
    });

    let currentUi = 'neobrutal';
    function applyUiMode(mode) {
      currentUi = mode === 'terminal' ? 'terminal' : 'neobrutal';
      document.body.setAttribute('data-ui', currentUi);
      uiToggle.textContent = currentUi === 'terminal' ? 'TERM' : 'UI';

    try { const s = localStorage.getItem(UI_PREF_KEY); if (s) applyUiMode(s); } catch (e) {}

    // --- STORAGE & DAILY AUTO-BACKUP ---
    function fnv1aHash(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return ('00000000' + h.toString(16)).slice(-8);
    }

    function createDefaultState() {
      return { setupComplete: false, upiAccounts: [], cashBalance: 0, transactions: [], friends: {}, nextId: 1 };
    }

    function normalizeState(raw) {
      if (!raw || typeof raw !== 'object') return createDefaultState();
      const upiAccounts = Array.isArray(raw.upiAccounts)
        ? raw.upiAccounts.map((a, idx) => ({
            id: a.id || `upi_${idx + 1}`,
            name: String(a.name || `UPI_${idx + 1}`).trim(),
            balance: Number(a.balance) || 0
          }))
        : [];
      return {
        setupComplete: Boolean(raw.setupComplete && upiAccounts.length > 0),
        upiAccounts,
        cashBalance: Number(raw.cashBalance) || 0,
        transactions: Array.isArray(raw.transactions) ? raw.transactions : [],
        friends: raw.friends && typeof raw.friends === 'object' ? raw.friends : {},
        nextId: Number(raw.nextId) || 1
      };
    }

    function computeStateChecksum(st) {
      return fnv1aHash(JSON.stringify({
        setupComplete: st.setupComplete, upiAccounts: st.upiAccounts,
        cashBalance: Number(st.cashBalance.toFixed(2)), transactions: st.transactions,
        friends: st.friends, nextId: st.nextId
      }));
    }

    function wrapEnvelope(stateObj, rev, source = 'local') {
      const normalized = normalizeState(stateObj);
      return { schema: 5, rev, updatedAt: Date.now(), source, checksum: computeStateChecksum(normalized), payload: normalized };
    }

    function verifyEnvelope(env) {
      if (!env || typeof env !== 'object' || !env.payload) return false;
      return computeStateChecksum(normalizeState(env.payload)) === env.checksum;
    }

    class StorageEngine {
      constructor() {
        this.db = null; this.currentRev = 0; this.lastChecksum = '';
        this.l1Healthy = false; this.l2Healthy = false;
        this.idbReadyPromise = this._openIDB();
      }
      _openIDB() {
        return new Promise((resolve) => {
          if (!('indexedDB' in window)) return resolve(null);
          try {
            const req = indexedDB.open(IDB_DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              if (!e.target.result.objectStoreNames.contains(IDB_STORE_NAME))
                e.target.result.createObjectStore(IDB_STORE_NAME, { keyPath: 'slot' });
            };
            req.onsuccess = (e) => { this.db = e.target.result; this.l2Healthy = true; resolve(this.db); };
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      readL1Envelope() {
        const list = [];
        [L1_PRIMARY_KEY, L1_BACKUP_KEY].forEach(k => {
          try {
            const raw = localStorage.getItem(k);
            if (raw) { const p = JSON.parse(raw); if (verifyEnvelope(p)) { list.push(p); this.l1Healthy = true; } }
          } catch (e) {}
        });
        return list.sort((a, b) => b.rev - a.rev)[0] || null;
      }
      writeL1Envelope(env) {
        try {
          const prev = localStorage.getItem(L1_PRIMARY_KEY);
          if (prev) localStorage.setItem(L1_BACKUP_KEY, prev);
          localStorage.setItem(L1_PRIMARY_KEY, JSON.stringify(env));
          this.l1Healthy = true;
        } catch (e) {}
      }
      async readL2Envelope() {
        await this.idbReadyPromise;
        if (!this.db) return null;
        return new Promise((resolve) => {
          try {
            const req = this.db.transaction(IDB_STORE_NAME, 'readonly').objectStore(IDB_STORE_NAME).getAll();
            req.onsuccess = () => {
              const valid = (req.result || []).map(r => r.envelope).filter(verifyEnvelope).sort((a, b) => b.rev - a.rev);
              resolve(valid[0] || null);
            };
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async writeL2Envelope(env) {
        await this.idbReadyPromise;
        if (!this.db) return;
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(IDB_STORE_NAME, 'readwrite');
            tx.objectStore(IDB_STORE_NAME).put({ slot: 'mirror_latest', envelope: env });
            tx.oncomplete = () => { this.l2Healthy = true; resolve(); };
            tx.onerror = () => resolve();
          } catch (e) { resolve(); }
        });
      }
      async loadAndHeal() {
        const l1 = this.readL1Envelope();
        const l2 = await this.readL2Envelope();
        let chosen = (l1 && l2) ? (l1.rev >= l2.rev ? l1 : l2) : (l1 || l2);
        if (!chosen) chosen = wrapEnvelope(createDefaultState(), 1, 'genesis');
        this.writeL1Envelope(chosen);
        await this.writeL2Envelope(chosen);
        this.currentRev = chosen.rev;
        this.lastChecksum = chosen.checksum;
        return normalizeState(chosen.payload);
      }
      async commit(stateObj, source = 'mutator') {
        const env = wrapEnvelope(stateObj, this.currentRev + 1, source);
        this.currentRev = env.rev;
        this.lastChecksum = env.checksum;
        this.writeL1Envelope(env);
        await this.writeL2Envelope(env);
        return env;
      }
    }

    const storageEngine = new StorageEngine();
    let state = createDefaultState();
    let wizard = { active: false, step: null, totalAccounts: 1, currentIdx: 0, tempName: '', collectedAccounts: [] };

    function runDailyAutoBackup(force = false) {
      try {
        const today = new Date().toISOString().slice(0, 10);
        const last = localStorage.getItem(LAST_BKP_KEY);
        if (!force && last === today) return null;
        const jsonStr = JSON.stringify(state);
        localStorage.setItem('cashflow_os_daily_snapshot_' + today, jsonStr);
        localStorage.setItem(LAST_BKP_KEY, today);
        if (window.AndroidNative && typeof window.AndroidNative.saveDailyBackup === 'function') {
          return window.AndroidNative.saveDailyBackup(jsonStr);
        }
        return 'Saved in LocalStorage (' + today + ')';
      } catch (e) { return null; }
    }
          function getTotalUpiBalance() {
      return state.upiAccounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
    }

    function displayBal(val) {
      return isMasked ? '₹••••' : `₹${Number(val).toLocaleString('en-IN')}`;
    }

    function renderFolderCards() {
      const totalUpi = getTotalUpiBalance();
      const totalNet = totalUpi + state.cashBalance;
      const formattedTotal = displayBal(totalNet);
      balBadge.textContent = formattedTotal;
      footerTotalVal.textContent = `Total: ${formattedTotal}`;

      if (!state.setupComplete) {
        nbGrid.innerHTML = '';
        return;
      }

      let rec = 0, pay = 0;
      Object.values(state.friends).forEach(v => { if (v > 0) rec += v; if (v < 0) pay += Math.abs(v); });

      const cards = [
        { color: '#22C55E', icon: '⚡', title: `UPI ${displayBal(totalUpi)}`, meta: `${state.upiAccounts.length} linked`, cmd: 'bal' },
        { color: '#FCD34D', icon: '₹',  title: `Cash ${displayBal(state.cashBalance)}`, meta: 'In wallet', cmd: 'bal' },
        { color: '#FB7185', icon: '⇄',  title: 'Friend Udhar', meta: isMasked ? '••••' : `Lena ₹${rec} • Dena ₹${pay}`, cmd: 'dues' },
        { color: '#818CF8', icon: '☰',  title: 'History & Stats', meta: `${state.transactions.length} entries`, cmd: 'ls' }
      ];

      nbGrid.innerHTML = cards.map(c => `
        <div class="folder-card-wrap" data-card-cmd="${c.cmd}">
          <div class="folder-tab" style="background:${c.color}"></div>
          <div class="folder-body">
            <span class="folder-icon">${c.icon}</span>
            <div class="folder-info">
              <div class="folder-title">${c.title}</div>
              <div class="folder-meta">${c.meta}</div>
            </div>
          </div>
        </div>
      `).join('');

      nbGrid.querySelectorAll('[data-card-cmd]').forEach(el => {
        el.addEventListener('click', () => runCommand(el.getAttribute('data-card-cmd')));
      });
    }

    function renderRecentFeedRows() {
      if (!state.transactions.length) return;
      outputEl.innerHTML = '';
      state.transactions.slice(0, 15).forEach(t => appendTxRow(t));
    }

    function appendTxRow(t) {
      const isPositive = t.type === 'CREDIT' || t.type === 'SETTLE_IN';
      const label = t.type === 'CREDIT' ? 'Credited' : (t.type === 'SETTLE_IN' ? 'Settled In' : (t.type === 'FRIEND_PAID' ? `${t.payer} Paid` : 'Debited'));
      const sign = isPositive ? '+' : '-';
      const amtCls = isPositive ? 'credit' : 'debit';

      const row = document.createElement('div');
      row.className = 'tx-row';
      row.innerHTML = `
        <div class="tx-left">
          <div class="tx-title">${label} • ${t.note}</div>
          <div class="tx-sub">#${t.id} • ${t.ts} • ${t.accountName}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amt ${amtCls}">${sign}₹${Number(t.amount).toLocaleString('en-IN')}</div>
          <div class="tx-cat">${t.category || 'General'}</div>
        </div>
      `;
      outputEl.appendChild(row);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    async function persistState(reason = 'cmd') {
      await storageEngine.commit(state, reason);
      renderFolderCards();
      runDailyAutoBackup(true);
    }

    function printLine(text, cls = '', gap = false) {
      const div = document.createElement('div');
      div.className = `line ${cls}`;
      if (gap) div.style.marginTop = '8px';
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function printBlock(text, cls = '') {
      const div = document.createElement('div');
      div.className = `box-block ${cls}`;
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function formatMoney(n, allowMask = false) {
      if (allowMask && isMasked) return '₹••••';
      return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
    function getTimestamp() {
      const now = new Date();
      return now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' ' +
             now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function revertTransactionByIndex(idx) {
      const tx = state.transactions[idx];
      const acc = state.upiAccounts.find(a => a.name === tx.accountName) || state.upiAccounts[0];
      if (tx.type === 'DEBIT') {
        if (tx.accountName === 'CASH') state.cashBalance += tx.amount; else if (acc) acc.balance += tx.amount;
        (tx.splitFriends || []).forEach(f => state.friends[f] = Math.round(((state.friends[f] || 0) - tx.perFriendShare) * 100) / 100);
      } else if (tx.type === 'FRIEND_PAID') {
        state.friends[tx.payer] = Math.round(((state.friends[tx.payer] || 0) + tx.myShare) * 100) / 100;
      } else if (tx.type === 'CREDIT') {
        if (tx.accountName === 'CASH') state.cashBalance -= tx.amount; else if (acc) acc.balance -= tx.amount;
      } else if (tx.type === 'SETTLE_IN') {
        if (tx.accountName === 'CASH') state.cashBalance -= tx.amount; else if (acc) acc.balance -= tx.amount;
      } else if (tx.type === 'SETTLE_OUT') {
        if (tx.accountName === 'CASH') state.cashBalance += tx.amount; else if (acc) acc.balance += tx.amount;
      }
      state.transactions.splice(idx, 1);
      return tx;
    }

    function startSetupWizard(isReconfig = false) {
      wizard = { active: true, step: 'COUNT', totalAccounts: 1, currentIdx: 0, tempName: '', collectedAccounts: [] };
      cmdInput.placeholder = 'Kitne UPI accounts hain? (1, 2, 3)...';
      printLine(isReconfig ? 'WALLET RE-SETUP' : 'WELCOME TO CASH FLOW OS', 'warn', true);
      printLine('Apke pass abhi kitne UPI / Bank accounts hain? (1, 2, ya 3 likhein)', 'info');
    }

    async function handleWizardInput(raw) {
      const text = raw.trim();
      if (wizard.step === 'COUNT') {
        const count = parseInt(text.replace(/[^\d]/g, ''), 10);
        if (!count || count < 1 || count > 10) return printLine('1 se 10 ke beech sankhya likhein.', 'debit');
        wizard.totalAccounts = count; wizard.currentIdx = 0; wizard.collectedAccounts = [];
        if (count === 1) {
          wizard.step = 'ACC_BAL'; wizard.tempName = 'UPI';
          printLine('1 UPI Account selected. Isme abhi kitna balance hai? (e.g. 2135)', 'info', true);
          cmdInput.placeholder = 'Enter UPI balance...';
        } else {
          wizard.step = 'ACC_NAME';
          printLine('Account #1 ka naam likhein (jaise SBI, HDFC, Paytm):', 'info', true);
          cmdInput.placeholder = 'Account #1 name...';
        }
        return;
      }
      if (wizard.step === 'ACC_NAME') {
        const name = text.replace(/[^a-zA-Z0-9 _-]/g, '').trim();
        if (!name) return printLine('Sahi naam likhein.', 'debit');
        wizard.tempName = name; wizard.step = 'ACC_BAL';
        printLine(`${name} mein abhi kitna balance hai?`, 'info', true);
        cmdInput.placeholder = `Balance in ${name}...`;
        return;
      }
      if (wizard.step === 'ACC_BAL') {
        const num = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(num) || num < 0) return printLine('Sahi amount likhein.', 'debit');
        wizard.collectedAccounts.push({ id: `upi_${wizard.currentIdx + 1}`, name: wizard.tempName, balance: num });
        wizard.currentIdx++;
        if (wizard.currentIdx < wizard.totalAccounts) {
          wizard.step = 'ACC_NAME';
          printLine(`Account #${wizard.currentIdx + 1} ka naam likhein:`, 'info', true);
          cmdInput.placeholder = `Account #${wizard.currentIdx + 1} name...`;
        } else {
          wizard.step = 'CASH';
          printLine('Abhi haath mein kitna CASH (नकद) pada hai? (e.g. 0 ya 500)', 'info', true);
          cmdInput.placeholder = 'Cash in hand...';
        }
        return;
      }
      if (wizard.step === 'CASH') {
        const cash = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(cash) || cash < 0) return printLine('Sahi Cash amount likhein.', 'debit');
        state.upiAccounts = wizard.collectedAccounts;
        state.cashBalance = cash; state.setupComplete = true; wizard.active = false;
        cmdInput.placeholder = '50 chai upi | 200 pizza with sachin';
        await persistState('setup');
        printLine('Setup Complete! Ab aap apna daily hisab likh sakte hain.', 'credit', true);
      }
    }

    const NON_FRIEND = new Set(['me','my','mere','mera','both','dono','hum','upi','cash','chai','food','khana','pizza','burger','auto','bus','petrol','bill','recharge','friend','dost','paid','for','by','with','and']);

    function resolveUpiAccount(lower) {
      if (!state.upiAccounts.length) return { id: 'upi_1', name: 'UPI', balance: 0 };
      if (state.upiAccounts.length === 1) return state.upiAccounts[0];
      for (const acc of state.upiAccounts) {
        if (new RegExp(`\\b${acc.name.toLowerCase()}\\b`, 'i').test(lower)) return acc;
      }
      return state.upiAccounts[0];
    }

    function extractAmount(text) {
      const m = text.replace(/,/g, '').match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : null;
    }

    function inferCategory(lower, isCredit) {
      if (isCredit) return 'Income';
      if (/\b(chai|tea|coffee|pizza|burger|food|khana|lunch|dinner|nashta|milk|grocery|sabzi)\b/.test(lower)) return 'Food';
      if (/\b(auto|bus|train|petrol|diesel|cab|ticket|kiraya|bike)\b/.test(lower)) return 'Transport';
      if (/\b(recharge|jio|vi|airtel|bill|bijli|rent|room)\b/.test(lower)) return 'Bills';
      if (/\b(shirt|pant|shoes|amazon|flipkart|shopping)\b/.test(lower)) return 'Shopping';
      return 'General';
    }

    async function runCommand(raw) {
      const text = raw.trim();
      if (!text) return;

      if (wizard.active) {
        printLine(`> ${text}`, 'cmd-echo');
        return handleWizardInput(text);
      }
      const lower = text.toLowerCase();

      if (lower === 'setup') return startSetupWizard(true);
      if (lower === 'lock') return engageLock();
      if (lower === 'clear') { outputEl.innerHTML = ''; return; }

      if (lower.startsWith('pin ')) {
        const newPin = text.split(/\s+/)[1] || '';
        if (!/^\d{4}$/.test(newPin)) return printLine('Usage: pin 1234 (4 digits only)', 'debit');
        try { localStorage.setItem(PIN_KEY, newPin); } catch (e) {}
        return printLine('[OK] App Lock PIN updated.', 'credit');
      }

      if (lower === 'backup') {
        const path = runDailyAutoBackup(true);
        const jsonStr = JSON.stringify(state);
        try { await navigator.clipboard.writeText(jsonStr); } catch (e) {}
        return printLine(`[BACKUP OK] Copied & saved to ${path || 'storage'}.`, 'credit');
      }

      if (lower.startsWith('restore ')) {
        try {
          state = normalizeState(JSON.parse(text.slice(8).trim()));
          await persistState('restore');
          renderRecentFeedRows();
          return printLine(`[RESTORED] ${state.transactions.length} entries loaded.`, 'credit');
        } catch (e) {
          return printLine('[ERR] Invalid backup JSON.', 'debit');
        }
      }

      if (lower === 'edit' || lower.startsWith('edit ')) {
        if (!state.transactions.length) return printLine('Edit karne ke liye koi entry nahi hai.', 'dim');
        const arg = lower.split(/\s+/)[1];
        const idx = arg ? state.transactions.findIndex(t => t.id === parseInt(arg, 10)) : 0;
        if (idx === -1) return printLine(`ID #${arg} nahi mila.`, 'debit');
        const reverted = revertTransactionByIndex(idx);
        await persistState('edit_revert');
        renderRecentFeedRows();
        cmdInput.value = reverted.note;
        cmdInput.focus();
        return printLine(`[EDITING #${reverted.id}] Purana balance adjust kar diya. Neeche text sudhar kar + dabayein.`, 'warn');
      }

      if (lower === 'undo') {
        if (!state.transactions.length) return printLine('Undo karne ke liye koi entry nahi hai.', 'dim');
        const reverted = revertTransactionByIndex(0);
        await persistState('undo');
        renderRecentFeedRows();
        return printLine(`[UNDO #${reverted.id}] "${reverted.note}" hata diya aur balance wapas kar diya.`, 'warn');
      }

      if (lower.startsWith('find ') || lower.startsWith('search ')) {
        const q = lower.replace(/^(?:find|search)\s+/, '').trim();
        if (!q) return printLine('Usage: find chai | find sachin', 'warn');
        const matches = state.transactions.filter(t =>
          t.note.toLowerCase().includes(q) ||
          (t.category && t.category.toLowerCase().includes(q)) ||
          (t.accountName && t.accountName.toLowerCase().includes(q)) ||
          (t.payer && t.payer.toLowerCase().includes(q)) ||
          (t.splitFriends && t.splitFriends.some(f => f.toLowerCase().includes(q)))
        );
        if (!matches.length) return printLine(`"${q}" se milti koi entry nahi mili.`, 'dim');
        const total = matches.reduce((s, t) => s + t.amount, 0);
        let out = `SEARCH: "${q.toUpperCase()}" (${matches.length} entries | Total: ${formatMoney(total)})\n\n`;
        matches.slice(0, 30).forEach(t => {
          const s = t.type === 'CREDIT' || t.type === 'SETTLE_IN' ? '+' : '-';
          out += `#${t.id} ${t.ts} | ${t.accountName} | ${s}${formatMoney(t.amount)} | ${t.note}\n`;
        });
        return printBlock(out, 'info');
      }

      if (lower === 'bal' || lower === 'balance' || /\b(kitna|bacha|balance|mauke|moke)\b/.test(lower) && !extractAmount(text)) {
        let rec = 0, pay = 0;
        Object.values(state.friends).forEach(v => { if (v > 0) rec += v; if (v < 0) pay += Math.abs(v); });
        let out = `BALANCE SHEET\n\n`;
        state.upiAccounts.forEach(a => out += `  ${a.name.padEnd(12)} : ${formatMoney(a.balance, true)}\n`);
        out += `  Cash         : ${formatMoney(state.cashBalance, true)}\n`;
        out += `  Lena Hai (+) : ${formatMoney(rec, true)}\n`;
        out += `  Dena Hai (-) : ${formatMoney(pay, true)}\n`;
        out += `  Net Worth    : ${formatMoney(getTotalUpiBalance() + state.cashBalance + rec - pay, true)}`;
        return printBlock(out);
      }

      if (lower === 'dues' || lower === 'udhar') {
        const list = Object.entries(state.friends).filter(([_, v]) => Math.abs(v) >= 0.01);
        if (!list.length) return printLine('Kisi dost ke saath udhar baaki nahi hai.', 'dim');
        let out = `FRIEND UDHAR LEDGER\n\n`;
        list.forEach(([n, v]) => out += `  ${n.padEnd(12)} : ${v > 0 ? 'LENA HAI +' + formatMoney(v, true) : 'DENA HAI -' + formatMoney(Math.abs(v), true)}\n`);
        return printBlock(out, 'split');
      }

      if (lower === 'ls' || lower.startsWith('ls ') || lower === 'history') {
        const filterStr = lower.replace(/^(?:ls|history)\s*/, '').trim();
        let list = state.transactions;
        if (filterStr && filterStr !== 'all') {
          list = list.filter(t => t.ts.toLowerCase().includes(filterStr));
        }
        if (!list.length) return printLine(`"${filterStr || 'all'}" ke liye koi transaction nahi hai.`, 'dim');
        const periodSpend = list.filter(t => (t.type === 'DEBIT' || t.type === 'FRIEND_PAID')).reduce((s, t) => s + (t.myShare || 0), 0);
        let out = `HISTORY (${(filterStr || 'ALL').toUpperCase()} - ${list.length} entries | Spend: ${formatMoney(periodSpend)})\n\n`;
        list.slice(0, 35).forEach(t => {
          const s = t.type === 'CREDIT' || t.type === 'SETTLE_IN' ? '+' : '-';
          out += `#${t.id} ${t.ts} | ${t.accountName} | ${s}${formatMoney(t.amount)} | ${t.note}\n`;
        });
        return printBlock(out);
      }

      if (lower === 'stats') {
        const deb = state.transactions.filter(t => (t.type === 'DEBIT' || t.type === 'FRIEND_PAID') && t.myShare > 0);
        if (!deb.length) return printLine('Abhi koi personal kharch nahi hai.', 'dim');
        const tot = deb.reduce((s, t) => s + t.myShare, 0);
        const map = {};
        deb.forEach(t => map[t.category] = (map[t.category] || 0) + t.myShare);
        let out = `YOUR EXPENSES (${formatMoney(tot)})\n\n`;
        Object.entries(map).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => {
          out += `  ${c.padEnd(12)} : ${formatMoney(v)} (${Math.round((v / tot) * 100)}%)\n`;
        });
        return printBlock(out);
      }

      if (lower.startsWith('settle ')) {
        const parts = text.split(/\s+/);
        const name = capitalize(parts[1] || '');
        const fKey = Object.keys(state.friends).find(k => k.toLowerCase() === name.toLowerCase());
        if (!fKey || Math.abs(state.friends[fKey]) < 0.01) return printLine(`${name} ka koi udhar baaki nahi hai.`, 'dim');
        const val = state.friends[fKey];
        const abs = Math.abs(val);
        const isCash = /\bcash\b/.test(lower);
        const acc = isCash ? null : resolveUpiAccount(lower);
        const txObj = {
          id: state.nextId++, ts: getTimestamp(), type: val > 0 ? 'SETTLE_IN' : 'SETTLE_OUT',
          amount: abs, myShare: 0, accountName: isCash ? 'CASH' : acc.name,
          category: 'Settlement', note: val > 0 ? `Settled from ${fKey}` : `Paid to ${fKey}`
        };
        if (val > 0) { if (isCash) state.cashBalance += abs; else acc.balance += abs; }
        else { if (isCash) state.cashBalance -= abs; else acc.balance -= abs; }
        state.friends[fKey] = 0;
        state.transactions.unshift(txObj);
        await persistState('settle');
        return appendTxRow(txObj);
      }

      if (lower.startsWith('rm ')) {
        const id = parseInt(lower.split(/\s+/)[1], 10);
        const idx = state.transactions.findIndex(t => t.id === id);
        if (idx === -1) return printLine(`ID #${id} nahi mila.`, 'debit');
        revertTransactionByIndex(idx);
        await persistState('rm');
        renderRecentFeedRows();
        return printLine(`[DELETED] #${id} hata diya aur balance adjust kar diya.`, 'warn');
      }

      const amt = extractAmount(text);
      if (!amt || amt <= 0) return printLine('Amount samajh nahi aaya. Example: "50 chai upi" ya "find sachin"', 'warn');

      const paidByM = lower.match(/\b(?:paid by|by)\s+([a-zA-Z]+)/) || lower.match(/^([a-zA-Z]+)\s+(?:ne|paid)\b/);
      if (paidByM && !NON_FRIEND.has(paidByM[1].toLowerCase())) {
        const payer = capitalize(paidByM[1]);
        const isBoth = /\b(both|dono|split)\b/.test(lower);
        const myShare = isBoth ? Math.round((amt / 2) * 100) / 100 : amt;
        state.friends[payer] = Math.round(((state.friends[payer] || 0) - myShare) * 100) / 100;
        const txObj = { id: state.nextId++, ts: getTimestamp(), type: 'FRIEND_PAID', amount: amt, myShare, payer, accountName: payer, category: inferCategory(lower, false), note: text };
        state.transactions.unshift(txObj);
        await persistState('friend_paid');
        return appendTxRow(txObj);
      }

      const isCredit = text.startsWith('+') || /\b(credit|credited|received|salary|stipend|income|added|refund|cashback|mila|mile|aaye)\b/.test(lower);
      const isCash = /\bcash\b/.test(lower);
      const acc = isCash ? null : resolveUpiAccount(lower);
      const chan = isCash ? 'CASH' : acc.name;

      let splitFriends = [];
      const withM = lower.match(/\b(?:with|and|ke sath)\s+([a-zA-Z\s,]+)/);
      if (!isCredit && withM) {
        splitFriends = withM[1].split(/[\s,]+/).filter(w => w.length >= 2 && !NON_FRIEND.has(w)).map(capitalize);
      }

      let myShare = amt, perFriendShare = 0;
      if (!isCredit && splitFriends.length > 0) {
        perFriendShare = Math.round((amt / (splitFriends.length + 1)) * 100) / 100;
        myShare = Math.round((amt - perFriendShare * splitFriends.length) * 100) / 100;
                splitFriends.forEach(f => state.friends[f] = Math.round(((state.friends[f] || 0) + perFriendShare) * 100) / 100);
      }

      if (isCredit) { if (isCash) state.cashBalance += amt; else acc.balance += amt; }
      else { if (isCash) state.cashBalance -= amt; else acc.balance -= amt; }

      const txObj = {
        id: state.nextId++, ts: getTimestamp(), type: isCredit ? 'CREDIT' : 'DEBIT',
        amount: amt, myShare: isCredit ? 0 : myShare, perFriendShare, splitFriends,
        accountName: chan, category: inferCategory(lower, isCredit), note: text
      };
      state.transactions.unshift(txObj);
      await persistState('tx');
      appendTxRow(txObj);
    }

    submitBtn.addEventListener('click', () => {
      const v = cmdInput.value;
      if (v.trim()) runCommand(v);
      cmdInput.value = '';
      cmdInput.focus();
    });
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitBtn.click(); }
    });

    document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => runCommand(b.getAttribute('data-cmd'))));
    document.querySelectorAll('[data-insert]').forEach(b => b.addEventListener('click', () => {
      cmdInput.value = cmdInput.value.replace(/\s+$/, '') + b.getAttribute('data-insert');
      cmdInput.focus();
    }));

    (async function boot() {
      state = await storageEngine.loadAndHeal();
      renderFolderCards();
      runDailyAutoBackup(false);
      if (!state.setupComplete) {
        startSetupWizard(false);
      } else if (state.transactions.length > 0) {
        renderRecentFeedRows();
      } else {
        printLine('Cash Flow OS Ready. Type "50 chai upi" to add your first entry.', 'dim');
      }
    })();
  </script>
</body>
</html>
