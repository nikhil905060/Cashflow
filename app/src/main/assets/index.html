<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cash Flow OS</title>
  <style>
    :root {
      --bg: #f6f8f7;
      --surface: #ffffff;
      --surface-2: #edf2ef;
      --fg: #111b15;
      --fg-dim: #52665a;
      --border: #d5e0da;
      --accent: #0f766e;
      --accent-fg: #ffffff;
      --credit: #0d9488;
      --debit: #dc2626;
      --warn: #d97706;
      --split: #7c3aed;
      --owe: #ea580c;
      --info: #0284c7;
      --font-main: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --radius: 14px;
    }

    body[data-ui="minimal-dark"] {
      --bg: #0f1412;
      --surface: #18201d;
      --surface-2: #212c28;
      --fg: #e8f0ec;
      --fg-dim: #94a89e;
      --border: #2a3832;
      --accent: #2dd4bf;
      --accent-fg: #082420;
      --credit: #34d399;
      --debit: #f87171;
      --warn: #fbbf24;
      --split: #c084fc;
      --owe: #fb923c;
      --info: #38bdf8;
    }

    body[data-ui="terminal"] {
      --bg: #040705;
      --surface: #08100b;
      --surface-2: #0d1a12;
      --fg: #00ff66;
      --fg-dim: #00b347;
      --border: #193823;
      --accent: #00ff66;
      --accent-fg: #040705;
      --credit: #00ffcc;
      --debit: #ff5c5c;
      --warn: #ffcc00;
      --split: #c792ea;
      --owe: #ff9e64;
      --info: #56b6c2;
      --font-main: 'JetBrains Mono', 'Courier New', monospace;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100dvh; background: var(--bg); color: var(--fg);
      font-family: var(--font-main); font-size: 14px; line-height: 1.45; overflow: hidden;
    }

    body[data-ui="terminal"]::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.28) 50%);
      background-size: 100% 3px;
    }

    #app {
      display: flex; flex-direction: column; height: 100dvh; max-width: 960px;
      margin: 0 auto; padding: 10px 12px 8px;
    }

    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 10px; flex-shrink: 0;
    }
    .brand { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
    .top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pill-btn {
      background: var(--surface); color: var(--fg); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .pill-btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .pill-btn:active { transform: scale(0.96); }

    #wallet-strip {
      display: flex; gap: 8px; overflow-x: auto; margin-bottom: 10px; flex-shrink: 0;
      scrollbar-width: none;
    }
    #wallet-strip::-webkit-scrollbar { display: none; }
    body[data-ui="terminal"] #wallet-strip { display: none; }

    .w-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 12px; min-width: 115px; flex-shrink: 0;
    }
    .w-label { font-size: 11px; color: var(--fg-dim); font-weight: 600; }
    .w-val { font-size: 15px; font-weight: 700; margin-top: 2px; }

    #nav-tabs {
      display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0;
    }
    body[data-ui="terminal"] #nav-tabs { display: none; }
    .tab-btn {
      flex: 1; background: var(--surface-2); color: var(--fg-dim); border: none;
      padding: 7px 6px; border-radius: 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .tab-btn.active { background: var(--accent); color: var(--accent-fg); }

    #output {
      flex: 1; overflow-y: auto; padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
    .section-gap { margin-top: 1.6em; }
    .cmd-echo { font-weight: 700; color: var(--accent); }
    .dim { color: var(--fg-dim); }
    .credit { color: var(--credit); font-weight: 600; }
    .debit { color: var(--debit); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .split { color: var(--split); font-weight: 600; }
    .owe { color: var(--owe); font-weight: 600; }
    .info { color: var(--info); font-weight: 600; }

    .box-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; margin: 1.4em 0;
      white-space: pre; overflow-x: auto; font-family: var(--font-mono); font-size: 12px;
    }
    body[data-ui="terminal"] .box-block {
      background: transparent; border: none; padding: 4px 0; margin: 2em 0;
    }
        #chips-row {
      display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; flex-shrink: 0;
      scrollbar-width: none;
    }
    #chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface); color: var(--fg); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: inherit;
    }
    body[data-ui="terminal"] .chip { border-radius: 4px; background: var(--surface-2); }
    .chip:active { background: var(--accent); color: var(--accent-fg); }

    #input-row {
      display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 10px;
    }
    body[data-ui="terminal"] #input-row {
      background: transparent; border: none; padding: 6px 0; margin-top: 1.4em;
    }
    .prompt-label { font-weight: 700; font-size: 12px; color: var(--accent); white-space: nowrap; }
    body:not([data-ui="terminal"]) .prompt-label { display: none; }

    #cmd-input {
      flex: 1; background: transparent; border: none; outline: none; color: var(--fg);
      font-family: inherit; font-size: 15px; min-width: 40px;
    }
    #cmd-input::placeholder { color: var(--fg-dim); opacity: 0.7; }

    #btn-enter {
      background: var(--accent); color: var(--accent-fg); border: none;
      border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 12px;
      cursor: pointer; font-family: inherit;
    }
    body[data-ui="terminal"] #btn-enter { border-radius: 4px; }
  </style>
</head>
<body data-ui="minimal-light">
  <div id="app">
    <div id="top-bar">
      <span class="brand" id="brand-title">Cash Flow OS</span>
      <div class="top-actions">
        <button type="button" class="pill-btn accent" id="ui-toggle">UI: Minimal</button>
        <button type="button" class="pill-btn" id="sync-badge">Sync #1</button>
        <button type="button" class="pill-btn" id="bal-badge">₹0</button>
      </div>
    </div>

    <div id="wallet-strip"></div>

    <div id="nav-tabs">
      <button type="button" class="tab-btn active" data-tab="feed">Feed</button>
      <button type="button" class="tab-btn" data-tab="ls">History</button>
      <button type="button" class="tab-btn" data-tab="dues">Udhar</button>
      <button type="button" class="tab-btn" data-tab="stats">Stats</button>
    </div>

    <div id="output" aria-live="polite"></div>

    <div id="chips-row">
      <button type="button" class="chip" data-cmd="bal">Balance</button>
      <button type="button" class="chip" data-cmd="dues">Udhar</button>
      <button type="button" class="chip" data-cmd="ls">History</button>
      <button type="button" class="chip" data-insert=" with ">+with</button>
      <button type="button" class="chip" data-insert=" paid by ">+paid by</button>
      <button type="button" class="chip" data-insert=" upi">+upi</button>
      <button type="button" class="chip" data-insert=" cash">+cash</button>
      <button type="button" class="chip" data-cmd="setup">Setup</button>
      <button type="button" class="chip" data-cmd="clear">Clear</button>
    </div>

    <div id="input-row">
      <span class="prompt-label" id="prompt-text">user@cashflow:~$</span>
      <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="e.g. 50 chai upi | 200 pizza with sachin" />
      <button type="button" id="btn-enter">SEND</button>
    </div>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const inputEl = document.getElementById('cmd-input');
    const promptEl = document.getElementById('prompt-text');
    const uiToggle = document.getElementById('ui-toggle');
    const balBadge = document.getElementById('bal-badge');
    const syncBadge = document.getElementById('sync-badge');
    const walletStrip = document.getElementById('wallet-strip');
    const btnEnter = document.getElementById('btn-enter');

    const L1_PRIMARY_KEY = 'cashflow_os_v5_primary';
    const L1_BACKUP_KEY  = 'cashflow_os_v5_backup';
    const IDB_DB_NAME    = 'CASHFLOW_OS_IDB_V5';
    const IDB_STORE_NAME = 'ledger_snapshots';
    const UI_PREF_KEY    = 'cashflow_os_ui_mode';

    const uiModes = [
      { id: 'minimal-light', label: 'UI: Minimal', title: 'Cash Flow OS', enter: 'SEND' },
      { id: 'minimal-dark',  label: 'UI: Dark',    title: 'Cash Flow OS', enter: 'SEND' },
      { id: 'terminal',      label: 'UI: Terminal',title: 'CASHFLOW_OS // TERMINAL', enter: 'EXEC ↵' }
    ];
    let uiIdx = 0;

    function applyUiMode(modeId) {
      const found = uiModes.findIndex(m => m.id === modeId);
      if (found !== -1) uiIdx = found;
      const cur = uiModes[uiIdx];
      document.body.setAttribute('data-ui', cur.id);
      uiToggle.textContent = cur.label;
      document.getElementById('brand-title').textContent = cur.title;
      btnEnter.textContent = cur.enter;
      try { localStorage.setItem(UI_PREF_KEY, cur.id); } catch (e) {}
    }

    uiToggle.addEventListener('click', () => {
      uiIdx = (uiIdx + 1) % uiModes.length;
      applyUiMode(uiModes[uiIdx].id);
    });

    try {
      const savedUi = localStorage.getItem(UI_PREF_KEY);
      if (savedUi) applyUiMode(savedUi);
    } catch (e) {}
        function fnv1aHash(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return ('00000000' + h.toString(16)).slice(-8);
    }

    function createDefaultState() {
      return {
        setupComplete: false,
        upiAccounts: [],
        cashBalance: 0,
        transactions: [],
        friends: {},
        nextId: 1
      };
    }

    function normalizeState(raw) {
      if (!raw || typeof raw !== 'object') return createDefaultState();
      const upiAccounts = Array.isArray(raw.upiAccounts)
        ? raw.upiAccounts.map((a, idx) => ({
            id: a.id || `upi_${idx + 1}`,
            name: String(a.name || `UPI_${idx + 1}`).trim(),
            balance: Number(a.balance) || 0
          }))
        : [];
      return {
        setupComplete: Boolean(raw.setupComplete && upiAccounts.length > 0),
        upiAccounts,
        cashBalance: Number(raw.cashBalance) || 0,
        transactions: Array.isArray(raw.transactions) ? raw.transactions : [],
        friends: raw.friends && typeof raw.friends === 'object' ? raw.friends : {},
        nextId: Number(raw.nextId) || 1
      };
    }

    function computeStateChecksum(st) {
      return fnv1aHash(JSON.stringify({
        setupComplete: st.setupComplete,
        upiAccounts: st.upiAccounts,
        cashBalance: Number(st.cashBalance.toFixed(2)),
        transactions: st.transactions,
        friends: st.friends,
        nextId: st.nextId
      }));
    }

    function wrapEnvelope(stateObj, rev, source = 'local') {
      const normalized = normalizeState(stateObj);
      return {
        schema: 5, rev, updatedAt: Date.now(), source,
        checksum: computeStateChecksum(normalized),
        payload: normalized
      };
    }

    function verifyEnvelope(env) {
      if (!env || typeof env !== 'object' || !env.payload) return false;
      return computeStateChecksum(normalizeState(env.payload)) === env.checksum;
    }

    class StorageEngine {
      constructor() {
        this.db = null;
        this.currentRev = 0;
        this.lastChecksum = '';
        this.l1Healthy = false;
        this.l2Healthy = false;
        this.lastSyncTime = null;
        this.idbReadyPromise = this._openIDB();
      }
      _openIDB() {
        return new Promise((resolve) => {
          if (!('indexedDB' in window)) return resolve(null);
          try {
            const req = indexedDB.open(IDB_DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
                db.createObjectStore(IDB_STORE_NAME, { keyPath: 'slot' });
              }
            };
            req.onsuccess = (e) => { this.db = e.target.result; this.l2Healthy = true; resolve(this.db); };
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      readL1Envelope() {
        const list = [];
        [L1_PRIMARY_KEY, L1_BACKUP_KEY].forEach(k => {
          try {
            const raw = localStorage.getItem(k);
            if (raw) {
              const p = JSON.parse(raw);
              if (verifyEnvelope(p)) { list.push(p); this.l1Healthy = true; }
            }
          } catch (e) {}
        });
        return list.sort((a, b) => b.rev - a.rev)[0] || null;
      }
      writeL1Envelope(env) {
        try {
          const prev = localStorage.getItem(L1_PRIMARY_KEY);
          if (prev) localStorage.setItem(L1_BACKUP_KEY, prev);
          localStorage.setItem(L1_PRIMARY_KEY, JSON.stringify(env));
          this.l1Healthy = true;
        } catch (e) {}
      }
      async readL2Envelope() {
        await this.idbReadyPromise;
        if (!this.db) return null;
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(IDB_STORE_NAME, 'readonly');
            const req = tx.objectStore(IDB_STORE_NAME).getAll();
            req.onsuccess = () => {
              const valid = (req.result || []).map(r => r.envelope).filter(verifyEnvelope).sort((a, b) => b.rev - a.rev);
              resolve(valid[0] || null);
            };
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async writeL2Envelope(env) {
        await this.idbReadyPromise;
        if (!this.db) return;
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(IDB_STORE_NAME, 'readwrite');
            tx.objectStore(IDB_STORE_NAME).put({ slot: 'mirror_latest', envelope: env });
            tx.oncomplete = () => { this.l2Healthy = true; resolve(); };
            tx.onerror = () => resolve();
          } catch (e) { resolve(); }
        });
      }
      async loadAndHeal() {
        const l1 = this.readL1Envelope();
        const l2 = await this.readL2Envelope();
        let chosen = (l1 && l2) ? (l1.rev >= l2.rev ? l1 : l2) : (l1 || l2);
        if (!chosen) {
          chosen = wrapEnvelope(createDefaultState(), 1, 'genesis');
        }
        this.writeL1Envelope(chosen);
        await this.writeL2Envelope(chosen);
        this.currentRev = chosen.rev;
        this.lastChecksum = chosen.checksum;
        this.lastSyncTime = chosen.updatedAt;
        return normalizeState(chosen.payload);
      }
      async commit(stateObj, source = 'mutator') {
        const env = wrapEnvelope(stateObj, this.currentRev + 1, source);
        this.currentRev = env.rev;
        this.lastChecksum = env.checksum;
        this.lastSyncTime = env.updatedAt;
        this.writeL1Envelope(env);
        await this.writeL2Envelope(env);
        return env;
      }
    }

    const storageEngine = new StorageEngine();
    let state = createDefaultState();
    let wizard = { active: false, step: null, totalAccounts: 1, currentIdx: 0, tempName: '', collectedAccounts: [] };

    function getTotalUpiBalance() {
      return state.upiAccounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
    }

    function renderWalletCards() {
      const totalNet = getTotalUpiBalance() + state.cashBalance;
      balBadge.textContent = `₹${totalNet.toLocaleString('en-IN')}`;
      syncBadge.textContent = `Sync #${storageEngine.currentRev}`;

      if (!state.setupComplete) {
        walletStrip.innerHTML = `<div class="w-card"><div class="w-label">STATUS</div><div class="w-val">Setup Pending</div></div>`;
        return;
      }
      let html = '';
      state.upiAccounts.forEach(acc => {
        html += `<div class="w-card"><div class="w-label">${acc.name}</div><div class="w-val">₹${acc.balance.toLocaleString('en-IN')}</div></div>`;
      });
      html += `<div class="w-card"><div class="w-label">CASH</div><div class="w-val">₹${state.cashBalance.toLocaleString('en-IN')}</div></div>`;
      html += `<div class="w-card"><div class="w-label">NET WORTH</div><div class="w-val" style="color:var(--accent)">₹${totalNet.toLocaleString('en-IN')}</div></div>`;
      walletStrip.innerHTML = html;
    }

    async function persistState(reason = 'cmd') {
      await storageEngine.commit(state, reason);
      renderWalletCards();
    }

    function printLine(text, cls = '', gap = false) {
      const div = document.createElement('div');
      div.className = `line ${cls}${gap ? ' section-gap' : ''}`;
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function printBlock(text, cls = '') {
      const div = document.createElement('div');
      div.className = `box-block ${cls}`;
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function formatMoney(n) {
      return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
    function getTimestamp() {
      const now = new Date();
      return now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' ' +
             now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
        function startSetupWizard(isReconfig = false) {
      wizard = { active: true, step: 'COUNT', totalAccounts: 1, currentIdx: 0, tempName: '', collectedAccounts: [] };
      promptEl.textContent = 'setup@cashflow:~$';
      inputEl.placeholder = 'Kitne UPI accounts hain? (e.g. 1, 2, 3)...';
      printLine(isReconfig ? 'WALLET RE-SETUP' : 'WELCOME TO CASH FLOW OS', 'warn', true);
      printLine('Apke pass abhi kitne UPI / Bank accounts hain? (1, 2, ya 3 likhein)', 'info');
    }

    async function handleWizardInput(raw) {
      const text = raw.trim();
      if (wizard.step === 'COUNT') {
        const count = parseInt(text.replace(/[^\d]/g, ''), 10);
        if (!count || count < 1 || count > 10) return printLine('1 se 10 ke beech sankhya likhein.', 'debit');
        wizard.totalAccounts = count;
        wizard.currentIdx = 0;
        wizard.collectedAccounts = [];
        if (count === 1) {
          wizard.step = 'ACC_BAL';
          wizard.tempName = 'UPI';
          printLine('1 UPI Account selected. Isme abhi kitna balance hai? (e.g. 2135)', 'info', true);
          inputEl.placeholder = 'Enter UPI balance...';
        } else {
          wizard.step = 'ACC_NAME';
          printLine(`Account #1 ka naam likhein (jaise SBI, HDFC, Paytm):`, 'info', true);
          inputEl.placeholder = 'Account #1 name...';
        }
        return;
      }
      if (wizard.step === 'ACC_NAME') {
        const name = text.replace(/[^a-zA-Z0-9 _-]/g, '').trim();
        if (!name) return printLine('Sahi naam likhein.', 'debit');
        wizard.tempName = name;
        wizard.step = 'ACC_BAL';
        printLine(`${name} mein abhi kitna balance hai?`, 'info', true);
        inputEl.placeholder = `Balance in ${name}...`;
        return;
      }
      if (wizard.step === 'ACC_BAL') {
        const num = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(num) || num < 0) return printLine('Sahi amount likhein.', 'debit');
        wizard.collectedAccounts.push({ id: `upi_${wizard.currentIdx + 1}`, name: wizard.tempName, balance: num });
        wizard.currentIdx++;
        if (wizard.currentIdx < wizard.totalAccounts) {
          wizard.step = 'ACC_NAME';
          printLine(`Account #${wizard.currentIdx + 1} ka naam likhein:`, 'info', true);
          inputEl.placeholder = `Account #${wizard.currentIdx + 1} name...`;
        } else {
          wizard.step = 'CASH';
          printLine('Abhi haath mein kitna CASH (नकद) pada hai? (e.g. 0 ya 500)', 'info', true);
          inputEl.placeholder = 'Cash in hand...';
        }
        return;
      }
      if (wizard.step === 'CASH') {
        const cash = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(cash) || cash < 0) return printLine('Sahi Cash amount likhein.', 'debit');
        state.upiAccounts = wizard.collectedAccounts;
        state.cashBalance = cash;
        state.setupComplete = true;
        wizard.active = false;
        promptEl.textContent = 'user@cashflow:~$';
        inputEl.placeholder = 'e.g. 50 chai upi | 200 pizza with sachin';
        await persistState('setup');
        printLine('Setup Complete! Ab aap apna daily hisab likh sakte hain.', 'credit', true);
      }
    }

    const NON_FRIEND = new Set(['me','my','mere','mera','both','dono','hum','upi','cash','chai','food','khana','pizza','burger','auto','bus','petrol','bill','recharge','friend','dost','paid','for','by','with','and']);

    function resolveUpiAccount(lower) {
      if (!state.upiAccounts.length) return { id: 'upi_1', name: 'UPI', balance: 0 };
      if (state.upiAccounts.length === 1) return state.upiAccounts[0];
      for (const acc of state.upiAccounts) {
        if (new RegExp(`\\b${acc.name.toLowerCase()}\\b`, 'i').test(lower)) return acc;
      }
      return state.upiAccounts[0];
    }

    function extractAmount(text) {
      const m = text.replace(/,/g, '').match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : null;
    }

    function inferCategory(lower, isCredit) {
      if (isCredit) return 'Income';
      if (/\b(chai|tea|coffee|pizza|burger|food|khana|lunch|dinner|nashta|milk|grocery|sabzi)\b/.test(lower)) return 'Food';
      if (/\b(auto|bus|train|petrol|diesel|cab|ticket|kiraya|bike)\b/.test(lower)) return 'Transport';
      if (/\b(recharge|jio|vi|airtel|bill|bijli|rent|room)\b/.test(lower)) return 'Bills';
      if (/\b(shirt|pant|shoes|amazon|flipkart|shopping)\b/.test(lower)) return 'Shopping';
      return 'General';
    }

    async function runCommand(raw) {
      const text = raw.trim();
      if (!text) return;
      printLine(`> ${text}`, 'cmd-echo', true);

      if (wizard.active) return handleWizardInput(text);
      const lower = text.toLowerCase();

      if (lower === 'setup') return startSetupWizard(true);
      if (lower === 'clear') { outputEl.innerHTML = ''; return; }
      if (lower === 'sync') {
        return printBlock(`SYNC STATUS\nRev: #${storageEngine.currentRev} | Checksum: ${storageEngine.lastChecksum}\nL1 Storage: ${storageEngine.l1Healthy ? 'OK' : 'ERR'} | L2 IDB: ${storageEngine.l2Healthy ? 'OK' : 'ERR'}`, 'info');
      }
      if (lower === 'bal' || lower === 'balance' || /\b(kitna|bacha|balance|mauke|moke)\b/.test(lower) && !extractAmount(text)) {
        let rec = 0, pay = 0;
        Object.values(state.friends).forEach(v => { if (v > 0) rec += v; if (v < 0) pay += Math.abs(v); });
        let out = `BALANCE SHEET\n\n`;
        state.upiAccounts.forEach(a => out += `  ${a.name.padEnd(12)} : ${formatMoney(a.balance)}\n`);
        out += `  Cash         : ${formatMoney(state.cashBalance)}\n`;
        out += `  Lena Hai (+) : ${formatMoney(rec)}\n`;
        out += `  Dena Hai (-) : ${formatMoney(pay)}\n`;
        out += `  Net Worth    : ${formatMoney(getTotalUpiBalance() + state.cashBalance + rec - pay)}`;
        return printBlock(out);
      }
      if (lower === 'dues' || lower === 'udhar') {
        const list = Object.entries(state.friends).filter(([_, v]) => Math.abs(v) >= 0.01);
        if (!list.length) return printLine('Kisi dost ke saath udhar baaki nahi hai.', 'dim');
        let out = `FRIEND UDHAR LEDGER\n\n`;
        list.forEach(([n, v]) => out += `  ${n.padEnd(12)} : ${v > 0 ? 'LENA HAI +' + formatMoney(v) : 'DENA HAI -' + formatMoney(Math.abs(v))}\n`);
        return printBlock(out, 'split');
      }
      if (lower === 'ls' || lower === 'history') {
        if (!state.transactions.length) return printLine('Abhi koi transaction nahi hai.', 'dim');
        let out = `HISTORY (${state.transactions.length})\n\n`;
        state.transactions.slice(0, 25).forEach(t => {
          const s = t.type === 'CREDIT' || t.type === 'SETTLE_IN' ? '+' : '-';
          out += `#${t.id} ${t.ts} | ${t.accountName} | ${s}${formatMoney(t.amount)} | ${t.note}\n`;
        });
        return printBlock(out);
      }
      if (lower === 'stats') {
        const deb = state.transactions.filter(t => (t.type === 'DEBIT' || t.type === 'FRIEND_PAID') && t.myShare > 0);
        if (!deb.length) return printLine('Abhi koi personal kharch nahi hai.', 'dim');
        const tot = deb.reduce((s, t) => s + t.myShare, 0);
        const map = {};
        deb.forEach(t => map[t.category] = (map[t.category] || 0) + t.myShare);
        let out = `YOUR EXPENSES (${formatMoney(tot)})\n\n`;
        Object.entries(map).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => {
          out += `  ${c.padEnd(12)} : ${formatMoney(v)} (${Math.round((v / tot) * 100)}%)\n`;
        });
        return printBlock(out);
      }
      if (lower.startsWith('settle ')) {
        const parts = text.split(/\s+/);
        const name = capitalize(parts[1] || '');
        const fKey = Object.keys(state.friends).find(k => k.toLowerCase() === name.toLowerCase());
        if (!fKey || Math.abs(state.friends[fKey]) < 0.01) return printLine(`${name} ka koi udhar baaki nahi hai.`, 'dim');
        const val = state.friends[fKey];
        const abs = Math.abs(val);
        const isCash = /\bcash\b/.test(lower);
        const acc = isCash ? null : resolveUpiAccount(lower);
        if (val > 0) {
          if (isCash) state.cashBalance += abs; else acc.balance += abs;
          state.friends[fKey] = 0;
          state.transactions.unshift({ id: state.nextId++, ts: getTimestamp(), type: 'SETTLE_IN', amount: abs, myShare: 0, accountName: isCash ? 'CASH' : acc.name, category: 'Settlement', note: `Settled from ${fKey}` });
          await persistState('settle');
          return printLine(`[SETTLED] ${fKey} se ${formatMoney(abs)} mile.`, 'credit');
        } else {
          if (isCash) state.cashBalance -= abs; else acc.balance -= abs;
          state.friends[fKey] = 0;
          state.transactions.unshift({ id: state.nextId++, ts: getTimestamp(), type: 'SETTLE_OUT', amount: abs, myShare: 0, accountName: isCash ? 'CASH' : acc.name, category: 'Settlement', note: `Paid to ${fKey}` });
          await persistState('settle');
          return printLine(`[SETTLED] ${fKey} ko ${formatMoney(abs)} diye.`, 'warn');
        }
      }
      if (lower.startsWith('rm ')) {
        const id = parseInt(lower.split(/\s+/)[1], 10);
        const idx = state.transactions.findIndex(t => t.id === id);
        if (idx === -1) return printLine(`ID #${id} nahi mila.`, 'debit');
        const tx = state.transactions[idx];
        const acc = state.upiAccounts.find(a => a.name === tx.accountName) || state.upiAccounts[0];
        if (tx.type === 'DEBIT') {
          if (tx.accountName === 'CASH') state.cashBalance += tx.amount; else if (acc) acc.balance += tx.amount;
          (tx.splitFriends || []).forEach(f => state.friends[f] = (state.friends[f] || 0) - tx.perFriendShare);
        } else if (tx.type === 'FRIEND_PAID') {
          state.friends[tx.payer] = (state.friends[tx.payer] || 0) + tx.myShare;
        } else if (tx.type === 'CREDIT') {
          if (tx.accountName === 'CASH') state.cashBalance -= tx.amount; else if (acc) acc.balance -= tx.amount;
        }
        state.transactions.splice(idx, 1);
        await persistState('rm');
        return printLine(`[DELETED] #${id} hata diya aur balance wapas adjust kar diya.`, 'warn');
      }

      const amt = extractAmount(text);
      if (!amt || amt <= 0) return printLine('Amount samajh nahi aaya. Example: "50 chai upi" ya "200 pizza with sachin"', 'warn');

      const paidByM = lower.match(/\b(?:paid by|by)\s+([a-zA-Z]+)/) || lower.match(/^([a-zA-Z]+)\s+(?:ne|paid)\b/);
      if (paidByM && !NON_FRIEND.has(paidByM[1].toLowerCase())) {
        const payer = capitalize(paidByM[1]);
        const isBoth = /\b(both|dono|split)\b/.test(lower);
        const myShare = isBoth ? Math.round((amt / 2) * 100) / 100 : amt;
        state.friends[payer] = Math.round(((state.friends[payer] || 0) - myShare) * 100) / 100;
        state.transactions.unshift({ id: state.nextId++, ts: getTimestamp(), type: 'FRIEND_PAID', amount: amt, myShare, payer, accountName: payer, category: inferCategory(lower, false), note: text });
        await persistState('friend_paid');
        return printLine(`[FRIEND PAID] ${payer} ne pay kiya | Apka kharch: ${formatMoney(myShare)} | Dena Hai: ${formatMoney(Math.abs(state.friends[payer]))}`, 'owe');
      }

      const isCredit = text.startsWith('+') || /\b(credit|credited|received|salary|stipend|income|added|refund|cashback|mila|mile|aaye)\b/.test(lower);
      const isCash = /\bcash\b/.test(lower);
      const acc = isCash ? null : resolveUpiAccount(lower);
      const chan = isCash ? 'CASH' : acc.name;

      let splitFriends = [];
      const withM = lower.match(/\b(?:with|and|ke sath)\s+([a-zA-Z\s,]+)/);
      if (!isCredit && withM) {
        splitFriends = withM[1].split(/[\s,]+/).filter(w => w.length >= 2 && !NON_FRIEND.has(w)).map(capitalize);
      }

      let myShare = amt, perFriendShare = 0;
      if (!isCredit && splitFriends.length > 0) {
        perFriendShare = Math.round((amt / (splitFriends.length + 1)) * 100) / 100;
        myShare = Math.round((amt - perFriendShare * splitFriends.length) * 100) / 100;
        splitFriends.forEach(f => state.friends[f] = Math.round(((state.friends[f] || 0) + perFriendShare) * 100) / 100);
      }

      if (isCredit) {
        if (isCash) state.cashBalance += amt; else acc.balance += amt;
      } else {
        if (isCash) state.cashBalance -= amt; else acc.balance -= amt;
      }

      state.transactions.unshift({
        id: state.nextId++, ts: getTimestamp(), type: isCredit ? 'CREDIT' : 'DEBIT',
        amount: amt, myShare: isCredit ? 0 : myShare, perFriendShare, splitFriends,
        accountName: chan, category: inferCategory(lower, isCredit), note: text
      });
      await persistState('tx');

      if (splitFriends.length > 0) {
        printLine(`[SPLIT] -${formatMoney(amt)} (${chan}) | Apka hissa: ${formatMoney(myShare)} | Lena Hai: ${splitFriends.join(', ')} (${formatMoney(perFriendShare)} each)`, 'split');
      } else {
        printLine(`[${isCredit ? 'CREDIT' : 'DEBIT'}] ${isCredit ? '+' : '-'}${formatMoney(amt)} (${chan}) | ${inferCategory(lower, isCredit)}`, isCredit ? 'credit' : 'debit');
      }
    }

    btnEnter.addEventListener('click', () => {
      const v = inputEl.value;
      if (v.trim()) runCommand(v);
      inputEl.value = '';
      inputEl.focus();
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); btnEnter.click(); }
    });
    document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => runCommand(b.getAttribute('data-cmd'))));
    document.querySelectorAll('[data-insert]').forEach(b => b.addEventListener('click', () => {
      inputEl.value = inputEl.value.replace(/\s+$/, '') + b.getAttribute('data-insert');
      inputEl.focus();
    }));
    document.querySelectorAll('.tab-btn').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.getAttribute('data-tab');
      if (target !== 'feed') runCommand(target);
    }));

    (async function boot() {
      state = await storageEngine.loadAndHeal();
      renderWalletCards();
      if (!state.setupComplete) {
        startSetupWizard(false);
      } else {
        printLine('Cash Flow OS Ready. Upar "UI: Minimal" button se aap kabhi bhi Minimal, Dark, ya Terminal theme badal sakte hain.', 'dim');
      }
    })();
  </script>
</body>
