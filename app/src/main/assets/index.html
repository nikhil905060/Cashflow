<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CASHFLOW_OS // Multi-UPI &amp; Friend Ledger Terminal</title>
  <style>
    :root {
      --bg: #040705;
      --fg: #00ff66;
      --fg-dim: #00993d;
      --fg-faint: rgba(0, 255, 102, 0.14);
      --glow: rgba(0, 255, 102, 0.35);
      --credit: #00ffcc;
      --debit: #ff5c5c;
      --warn: #ffcc00;
      --split: #c792ea;
      --owe: #ff9e64;
      --info: #56b6c2;
      --key-bg: #0b140e;
      --key-border: #193823;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    body[data-theme="amber"] {
      --bg: #080502;
      --fg: #ffb000;
      --fg-dim: #9c6b00;
      --fg-faint: rgba(255, 176, 0, 0.14);
      --glow: rgba(255, 176, 0, 0.35);
      --credit: #7dff8a;
      --debit: #ff5555;
      --warn: #ffe66d;
      --split: #e0aaff;
      --owe: #ff9e64;
      --info: #64dfdf;
      --key-bg: #140e06;
      --key-border: #3d2a0d;
    }

    body[data-theme="cyan"] {
      --bg: #03070a;
      --fg: #00e5ff;
      --fg-dim: #008294;
      --fg-faint: rgba(0, 229, 255, 0.14);
      --glow: rgba(0, 229, 255, 0.35);
      --credit: #39ff14;
      --debit: #ff4d6d;
      --warn: #ffd166;
      --split: #d8b4fe;
      --owe: #fb923c;
      --info: #90e0ef;
      --key-bg: #07131a;
      --key-border: #123647;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
      text-shadow: 0 0 5px var(--glow);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 3px;
      z-index: 9998;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0) 62%, rgba(0,0,0,0.68) 100%);
      z-index: 9999;
      pointer-events: none;
    }

    #terminal {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100%;
      padding: 10px 14px 8px 14px;
      max-width: 1060px;
      margin: 0 auto;
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 4px;
      margin-bottom: 2em;
      font-size: 11px;
      color: var(--fg-dim);
      flex-shrink: 0;
    }

    .badge {
      border: 1px solid var(--fg-dim);
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }

    .badge:active {
      background: var(--fg);
      color: var(--bg);
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--fg-dim) transparent;
      -webkit-overflow-scrolling: touch;
    }

    #output::-webkit-scrollbar { width: 5px; }
    #output::-webkit-scrollbar-thumb { background: var(--fg-dim); }

    .line {
      margin-bottom: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-gap {
      margin-top: 2em;
    }

    .cmd-echo { color: var(--fg); font-weight: bold; }
    .dim { color: var(--fg-dim); }
    .credit { color: var(--credit); text-shadow: 0 0 6px rgba(0, 255, 204, 0.35); }
    .debit { color: var(--debit); text-shadow: 0 0 6px rgba(255, 92, 92, 0.35); }
    .warn { color: var(--warn); }
    .split { color: var(--split); }
    .owe { color: var(--owe); }
    .info { color: var(--info); }

    .box-block {
      padding: 4px 0;
      margin: 2em 0;
      white-space: pre;
      overflow-x: auto;
      font-size: 12.5px;
      line-height: 1.45;
    }

    #input-row {
      display: flex;
      align-items: center;
      margin-top: 2em;
      padding-top: 4px;
      gap: 8px;
      flex-shrink: 0;
    }

    .prompt-label {
      color: var(--fg);
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
      font-size: 13px;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 15px;
      caret-color: var(--fg);
      text-shadow: 0 0 5px var(--glow);
      min-width: 50px;
    }

    #cmd-input::placeholder {
      color: var(--fg-dim);
      opacity: 0.65;
    }

    #mobile-toolbar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2em;
      padding-top: 4px;
      flex-shrink: 0;
      user-select: none;
    }

    .key-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .key-row::-webkit-scrollbar { display: none; }

    .t-key {
      background: var(--key-bg);
      color: var(--fg);
      border: 1px solid var(--key-border);
      border-radius: 4px;
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      text-align: center;
      transition: background 0.08s, transform 0.05s;
    }

    .t-key:active {
      background: var(--fg);
      color: var(--bg);
      transform: scale(0.96);
    }

    .t-key.primary {
      border-color: var(--fg-dim);
      background: var(--fg-faint);
    }

    .t-key.split-key {
      border-color: var(--split);
      color: var(--split);
    }

    .t-key.owe-key {
      border-color: var(--owe);
      color: var(--owe);
    }

    .t-key.exec {
      background: var(--fg);
      color: var(--bg);
      text-shadow: none;
      margin-left: auto;
      padding: 7px 14px;
    }

    @media (max-width: 600px) {
      #terminal { padding: 8px 10px 6px 10px; }
      .box-block { font-size: 11px; }
      .prompt-label { font-size: 12px; }
    }
  </style>
</head>
<body data-theme="green">
  <div id="terminal">
    <div id="top-bar">
      <span>CASHFLOW_OS // MULTI-UPI TERMINAL</span>
      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <span class="badge" id="sync-badge" title="Tap for Persistence & Sync Telemetry">SYNC: INIT</span>
        <span class="badge" id="bal-badge">BAL: ₹0</span>
        <span class="badge" id="audio-toggle">[SFX: ON]</span>
        <span class="badge" id="theme-toggle">[GREEN]</span>
      </div>
    </div>

    <div id="output" aria-live="polite"></div>

    <div id="input-row">
      <span class="prompt-label" id="prompt-text">user@cashflow:~$</span>
      <input
        type="text"
        id="cmd-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="e.g. 50 chai upi | 200 pizza with sachin | bal"
      />
    </div>

    <div id="mobile-toolbar">
      <div class="key-row">
        <button type="button" class="t-key primary" id="btn-up">▲ UP</button>
        <button type="button" class="t-key primary" id="btn-down">▼ DOWN</button>
        <button type="button" class="t-key" id="btn-tab">TAB ⇥</button>
        <button type="button" class="t-key" id="btn-clear">CLEAR</button>
        <button type="button" class="t-key exec" id="btn-enter">EXEC ↵</button>
      </div>
      <div class="key-row">
        <button type="button" class="t-key" data-cmd="bal">bal</button>
        <button type="button" class="t-key" data-cmd="dues">dues</button>
        <button type="button" class="t-key" data-cmd="ls">ls</button>
        <button type="button" class="t-key" data-cmd="stats">stats</button>
        <button type="button" class="t-key split-key" data-insert=" with ">+with</button>
        <button type="button" class="t-key owe-key" data-insert=" paid by ">+paid by</button>
        <button type="button" class="t-key" data-insert=" upi">+upi</button>
        <button type="button" class="t-key" data-insert=" cash">+cash</button>
        <button type="button" class="t-key" data-cmd="help">help</button>
      </div>
    </div>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const inputEl = document.getElementById('cmd-input');
    const promptEl = document.getElementById('prompt-text');
    const audioToggle = document.getElementById('audio-toggle');
    const themeToggle = document.getElementById('theme-toggle');
    const balBadge = document.getElementById('bal-badge');
    const syncBadge = document.getElementById('sync-badge');

    const L1_PRIMARY_KEY = 'cashflow_os_v5_primary';
    const L1_BACKUP_KEY  = 'cashflow_os_v5_backup';
    const IDB_DB_NAME    = 'CASHFLOW_OS_IDB_V5';
    const IDB_STORE_NAME = 'ledger_snapshots';
    const SYNC_CHANNEL   = 'cashflow_os_v5_bus';

    // --- SOUND FX ---
    let soundEnabled = true;
    let audioCtx = null;

    function playTone(freq = 620, duration = 0.025, type = 'square', vol = 0.025) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    audioToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      audioToggle.textContent = soundEnabled ? '[SFX: ON]' : '[SFX: OFF]';
      if (soundEnabled) playTone(880, 0.05);
    });

    const themes = ['green', 'amber', 'cyan'];
    let themeIdx = 0;
    function setTheme(name) {
      const idx = themes.indexOf(name);
      if (idx !== -1) themeIdx = idx;
      document.body.setAttribute('data-theme', themes[themeIdx]);
      themeToggle.textContent = `[${themes[themeIdx].toUpperCase()}]`;
    }
    themeToggle.addEventListener('click', () => {
      themeIdx = (themeIdx + 1) % themes.length;
      setTheme(themes[themeIdx]);
      playTone(720, 0.04);
    });

    // --- CHECKSUM & STATE ---
    function fnv1aHash(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return ('00000000' + h.toString(16)).slice(-8);
    }

    function createDefaultState() {
      return {
        setupComplete: false,
        upiAccounts: [], // [{ id: 'upi_1', name: 'SBI', balance: 2135 }]
        cashBalance: 0,
        transactions: [],
        friends: {},
        nextId: 1
      };
    }

    function normalizeState(raw) {
      const def = createDefaultState();
      if (!raw || typeof raw !== 'object') return def;
      const upiAccounts = Array.isArray(raw.upiAccounts)
        ? raw.upiAccounts.map((a, idx) => ({
            id: a.id || `upi_${idx + 1}`,
            name: String(a.name || `UPI_${idx + 1}`).trim(),
            balance: Number(a.balance) || 0
          }))
        : [];
      return {
        setupComplete: Boolean(raw.setupComplete && upiAccounts.length > 0),
        upiAccounts,
        cashBalance: Number(raw.cashBalance) || 0,
        transactions: Array.isArray(raw.transactions) ? raw.transactions : [],
        friends: raw.friends && typeof raw.friends === 'object' ? raw.friends : {},
        nextId: Number(raw.nextId) || 1
      };
    }

    function computeStateChecksum(st) {
      const canonical = JSON.stringify({
        setupComplete: st.setupComplete,
        upiAccounts: st.upiAccounts,
        cashBalance: Number(st.cashBalance.toFixed(2)),
        transactions: st.transactions,
        friends: st.friends,
        nextId: st.nextId
      });
      return fnv1aHash(canonical);
    }

    function wrapEnvelope(stateObj, rev, source = 'local') {
      const normalized = normalizeState(stateObj);
      return {
        schema: 5,
        rev,
        updatedAt: Date.now(),
        source,
        checksum: computeStateChecksum(normalized),
        payload: normalized
      };
    }

    function verifyEnvelope(env) {
      if (!env || typeof env !== 'object' || !env.payload) return false;
      if (typeof env.rev !== 'number' || typeof env.checksum !== 'string') return false;
      const expected = computeStateChecksum(normalizeState(env.payload));
      return expected === env.checksum;
    }

    // --- DUAL-LAYER PERSISTENCE ENGINE (L1 localStorage + L2 IndexedDB) ---
    class StorageEngine {
      constructor() {
        this.db = null;
        this.currentRev = 0;
        this.lastChecksum = '';
        this.l1Healthy = false;
        this.l2Healthy = false;
        this.lastSyncTime = null;
        this.recoveryLog = [];
        this.idbReadyPromise = this._openIDB();
      }

      _openIDB() {
        return new Promise((resolve) => {
          if (!('indexedDB' in window)) {
            this.l2Healthy = false;
            return resolve(null);
          }
          try {
            const req = indexedDB.open(IDB_DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
                db.createObjectStore(IDB_STORE_NAME, { keyPath: 'slot' });
              }
            };
            req.onsuccess = (e) => {
              this.db = e.target.result;
              this.l2Healthy = true;
              resolve(this.db);
            };
            req.onerror = () => {
              this.l2Healthy = false;
              resolve(null);
            };
          } catch (err) {
            this.l2Healthy = false;
            resolve(null);
          }
        });
      }

      readL1Envelope() {
        const candidates = [];
        [L1_PRIMARY_KEY, L1_BACKUP_KEY].forEach((k) => {
          try {
            const raw = localStorage.getItem(k);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (verifyEnvelope(parsed)) {
                candidates.push(parsed);
                this.l1Healthy = true;
              }
            }
          } catch (e) {}
        });
        candidates.sort((a, b) => b.rev - a.rev);
        return candidates[0] || null;
      }

      writeL1Envelope(env) {
        const serialized = JSON.stringify(env);
        try {
          const prev = localStorage.getItem(L1_PRIMARY_KEY);
          if (prev) localStorage.setItem(L1_BACKUP_KEY, prev);
          localStorage.setItem(L1_PRIMARY_KEY, serialized);
          this.l1Healthy = true;
          return true;
        } catch (e) {
          this.l1Healthy = false;
          return false;
        }
      }

      async readL2Envelope() {
        await this.idbReadyPromise;
        if (!this.db) return null;
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(IDB_STORE_NAME, 'readonly');
            const store = tx.objectStore(IDB_STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => {
              const rows = Array.isArray(req.result) ? req.result : [];
              const valid = rows.map(r => r.envelope).filter(verifyEnvelope).sort((a, b) => b.rev - a.rev);
              this.l2Healthy = true;
              resolve(valid[0] || null);
            };
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
      }

      async writeL2Envelope(env) {
        await this.idbReadyPromise;
        if (!this.db) return false;
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(IDB_STORE_NAME, 'readwrite');
            const store = tx.objectStore(IDB_STORE_NAME);
            const getLatest = store.get('mirror_latest');
            getLatest.onsuccess = () => {
              const existing = getLatest.result;
              if (existing && existing.envelope) {
                store.put({ slot: 'mirror_prev', envelope: existing.envelope });
              }
              store.put({ slot: 'mirror_latest', envelope: env });
            };
            tx.oncomplete = () => {
              this.l2Healthy = true;
              resolve(true);
            };
            tx.onerror = () => resolve(false);
          } catch (e) {
            resolve(false);
          }
        });
      }

      async loadAndHeal() {
        const l1 = this.readL1Envelope();
        const l2 = await this.readL2Envelope();
        let chosen = null;

        if (l1 && l2) {
          if (l1.rev >= l2.rev) {
            chosen = l1;
            if (l1.rev > l2.rev) {
              await this.writeL2Envelope(l1);
              this.recoveryLog.push(`L2 synced forward to rev #${l1.rev}`);
            }
          } else {
            chosen = l2;
            this.writeL1Envelope(l2);
            this.recoveryLog.push(`L1 healed from L2 rev #${l2.rev}`);
          }
        } else if (l1) {
          chosen = l1;
          await this.writeL2Envelope(l1);
        } else if (l2) {
          chosen = l2;
          this.writeL1Envelope(l2);
          this.recoveryLog.push(`L1 restored from IndexedDB rev #${l2.rev}`);
        } else {
          chosen = wrapEnvelope(createDefaultState(), 1, 'genesis');
          this.writeL1Envelope(chosen);
          await this.writeL2Envelope(chosen);
        }

        this.currentRev = chosen.rev;
        this.lastChecksum = chosen.checksum;
        this.lastSyncTime = chosen.updatedAt;
        return normalizeState(chosen.payload);
      }

      async commit(stateObj, source = 'mutator') {
        const nextRev = this.currentRev + 1;
        const env = wrapEnvelope(stateObj, nextRev, source);
        this.currentRev = nextRev;
        this.lastChecksum = env.checksum;
        this.lastSyncTime = env.updatedAt;
        this.writeL1Envelope(env);
        await this.writeL2Envelope(env);
        return env;
      }

      async flushCurrent(stateObj, reason = 'lifecycle') {
        const env = wrapEnvelope(stateObj, Math.max(1, this.currentRev), reason);
        this.lastSyncTime = env.updatedAt;
        this.writeL1Envelope(env);
        await this.writeL2Envelope(env);
        return env;
      }
    }

    // --- LIFECYCLE SYNC ---
    class LifecycleSync {
      constructor(engine, getStateFn, onExternalUpdateFn, onStatusChangeFn) {
        this.engine = engine;
        this.getState = getStateFn;
        this.onExternalUpdate = onExternalUpdateFn;
        this.onStatusChange = onStatusChangeFn;
        this.tabId = Math.random().toString(36).slice(2, 8);
        this.channel = null;
        this.events = [];
        this._bindChannel();
        this._bindHooks();
      }

      _log(evt) {
        this.events.unshift({ ts: Date.now(), evt });
        if (this.events.length > 10) this.events.pop();
      }

      _bindChannel() {
        try {
          if ('BroadcastChannel' in window) {
            this.channel = new BroadcastChannel(SYNC_CHANNEL);
            this.channel.onmessage = (e) => {
              const msg = e.data;
              if (!msg || msg.sender === this.tabId) return;
              if (msg.type === 'STATE_COMMIT' && verifyEnvelope(msg.envelope)) {
                if (msg.envelope.rev > this.engine.currentRev) {
                  this.engine.currentRev = msg.envelope.rev;
                  this.engine.las                  tChecksum = latest.checksum;
          this.engine.lastSyncTime = latest.updatedAt;
          this.onExternalUpdate(normalizeState(latest.payload), latest.rev);
        } else {
          await this.engine.flushCurrent(this.getState(), reason);
        }
        this.onStatusChange();
      }

      _bindHooks() {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            this.engine.flushCurrent(this.getState(), 'hidden');
          } else if (document.visibilityState === 'visible') {
            this.reconcile('visible');
          }
        });
        window.addEventListener('pagehide', () => this.engine.flushCurrent(this.getState(), 'pagehide'));
        window.addEventListener('beforeunload', () => this.engine.flushCurrent(this.getState(), 'beforeunload'));
        window.addEventListener('online', () => this.reconcile('online'));
        window.addEventListener('focus', () => this.reconcile('focus'));
      }
    }

    const storageEngine = new StorageEngine();
    let state = createDefaultState();
    let lifecycleSync = null;

    // --- FIRST-BOOT SETUP WIZARD STATE ---
    // steps: 'COUNT' -> 'ACC_NAME' -> 'ACC_BAL' -> 'CASH' -> null
    let wizard = {
      active: false,
      step: null,
      totalAccounts: 1,
      currentIdx: 0,
      tempName: '',
      collectedAccounts: []
    };

    function getTotalUpiBalance() {
      return state.upiAccounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0);
    }

    function updateBadges() {
      const totalNet = getTotalUpiBalance() + state.cashBalance;
      balBadge.textContent = `BAL: ₹${totalNet.toLocaleString('en-IN')}`;
      const l1 = storageEngine.l1Healthy ? 'L1' : '!L1';
      const l2 = storageEngine.l2Healthy ? 'L2' : '!L2';
      syncBadge.textContent = `SYNC: ${l1}+${l2} | #${storageEngine.currentRev}`;
    }

    async function persistState(reason = 'command') {
      const env = await storageEngine.commit(state, reason);
      if (lifecycleSync) lifecycleSync.broadcastCommit(env);
      updateBadges();
    }

    window.forceAppSync = async function(reason) {
      if (lifecycleSync) await lifecycleSync.reconcile(reason || 'native_hook');
    };

    syncBadge.addEventListener('click', () => {
      playTone(760, 0.04);
      runCommand('sync');
    });

    function startSetupWizard(isReconfigure = false) {
      wizard = {
        active: true,
        step: 'COUNT',
        totalAccounts: 1,
        currentIdx: 0,
        tempName: '',
        collectedAccounts: []
      };
      promptEl.textContent = 'setup@cashflow:~$';
      inputEl.placeholder = 'Enter number of UPI accounts (e.g. 1, 2, 3)...';

      printLine('', '', true);
      printLine(isReconfigure ? '=== RE-CONFIGURING WALLETS ===' : '=== FIRST-BOOT WALLET SETUP ===', 'warn');

    async function handleWizardInput(raw) {
      const text = raw.trim();
      if (!text) return;

      if (wizard.step === 'COUNT') {
        const count = parseInt(text.replace(/[^\d]/g, ''), 10);
        if (!count || count < 1 || count > 10) {
          printLine('[ERR] Kripya 1 se 10 ke beech sahi sankhya likhein (jaise: 1 ya 2).', 'debit');
          playTone(220, 0.12, 'sawtooth');
          return;
        }
        wizard.totalAccounts = count;
        wizard.currentIdx = 0;
        wizard.collectedAccounts = [];

        if (count === 1) {
          wizard.step = 'ACC_BAL';
          wizard.tempName = 'Primary UPI';
          printLine('', '', true);
          printLine('1 UPI account selected (Primary UPI).', 'credit');
          printLine('Abhi is UPI account mein kitna balance pada hai? (INR mein number likhein, jaise 2135):', 'info');
          inputEl.placeholder = 'Enter current UPI balance (e.g. 2135)...';
        } else {
          wizard.step = 'ACC_NAME';
          printLine('', '', true);
          printLine(`${count} UPI accounts set karne hain.`, 'credit');
          printLine(`Account #1 ka naam kya hai? (jaise SBI, HDFC, Paytm, GPay):`, 'info');
          inputEl.placeholder = 'Enter Account #1 name (e.g. SBI)...';
        }
        playTone(680, 0.05);
        return;
      }

      if (wizard.step === 'ACC_NAME') {
        const cleanName = text.replace(/[^a-zA-Z0-9 _-]/g, '').trim();
        if (!cleanName) {
          printLine('[ERR] Account ka sahi naam likhein (jaise SBI ya HDFC).', 'debit');
          playTone(220, 0.12, 'sawtooth');
          return;
        }
        wizard.tempName = cleanName;
        wizard.step = 'ACC_BAL';
        printLine('', '', true);
        printLine(`[${cleanName}] mein abhi kitna balance pada hai? (e.g. 2135 ya 0):`, 'info');
        inputEl.placeholder = `Balance in ${cleanName} (INR)...`;
        playTone(680, 0.05);
        return;
      }

      if (wizard.step === 'ACC_BAL') {
        const num = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(num) || num < 0) {
          printLine('[ERR] Sahi amount likhein (jaise 2135 ya 0).', 'debit');
          playTone(220, 0.12, 'sawtooth');
          return;
        }
        wizard.collectedAccounts.push({
          id: `upi_${wizard.currentIdx + 1}`,
          name: wizard.tempName,
          balance: Math.round(num * 100) / 100
        });
        wizard.currentIdx++;

        if (wizard.currentIdx < wizard.totalAccounts) {
          wizard.step = 'ACC_NAME';
          printLine('', '', true);
          printLine(`✓ ${wizard.tempName}: ₹${num.toLocaleString('en-IN')} saved.`, 'credit');
          printLine(`Account #${wizard.currentIdx + 1} ka naam kya hai? (jaise HDFC, Kotak, Paytm):`, 'info');
          inputEl.placeholder = `Enter Account #${wizard.currentIdx + 1} name...`;
          playTone(680, 0.05);
        } else {
          wizard.step = 'CASH';
          printLine('', '', true);
          printLine(`✓ ${wizard.tempName}: ₹${num.toLocaleString('en-IN')} saved.`, 'credit');
          printLine('Aakhiri sawaal: Abhi aapke pass haath mein kitna CASH (नकद) pada hai? (e.g. 500 ya 0):', 'info');
          inputEl.placeholder = 'Enter Cash in hand (e.g. 0 or 500)...';
          playTone(720, 0.05);
        }
        return;
      }

      if (wizard.step === 'CASH') {
        const cashNum = parseFloat(text.replace(/,/g, '').replace(/[^\d.]/g, ''));
        if (isNaN(cashNum) || cashNum < 0) {
          printLine('[ERR] Sahi Cash amount likhein (jaise 0 ya 500).', 'debit');
          playTone(220, 0.12, 'sawtooth');
          return;
        }

        state.upiAccounts = wizard.collectedAccounts;
        state.cashBalance = Math.round(cashNum * 100) / 100;

        wizard.active = false;
        wizard.step = null;

          ? 'e.g. 50 chai upi | 200 pizza with sachin | bal'

        printLine('[OK] WALLET SETUP COMPLETE!', 'credit');

          const tag = state.upiAccounts.length > 1 && i === 0 ? ' [Primary]' : '';
          printLine(`  • ${acc.name}${tag} : ₹${acc.balance.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`, 'credit');

    // --- ACCOUNT MATCHING HELPER ---
    function resolveUpiAccount(lowerText) {
      if (!state.upiAccounts || state.upiAccounts.length === 0) {
        return { id: 'upi_1', name: 'UPI', balance: 0 };
      }
      if (state.upiAccounts.length === 1) {
        return state.upiAccounts[0];
      }
      for (const acc of state.upiAccounts) {
        const escaped = acc.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b${escaped}\\b`, 'i');
        if (regex.test(lowerText)) {
          return acc;
        }
      }
      return state.upiAccounts[0];
    }

    // --- NATURAL LANGUAGE PARSER ---

    const NON_FRIEND_WORDS = new Set([
      'me', 'myself', 'i', 'my', 'mine', 'mere', 'mera', 'meri', 'mujhko', 'mujhe',
      'both', 'dono', 'hum', 'us', 'we', 'all', 'sab', 'everyone', 'each',

      'only', 'sirf', 'total', 'half', 'aadha', 'split', 'share', 'equal', 'barabar', 'money', 'paise', 'rupees', 'rs', 'inr'
    ]);

    function inferCategory(text, type) {
      const lower = text.toLowerCase();
      if (type === 'CREDIT') {
        for (const kw of CATEGORIES.Income) {
          if (lower.includes(kw)) return 'Income';
        }
        return 'Transfer/In';
      }
      for (const [cat, keywords] of Object.entries(CATEGORIES)) {
        if (cat === 'Income') continue;
        for (const kw of keywords) {
          const regex = new RegExp(`\\b${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
          if (regex.test(lower)) return cat;
        }
      }
      return 'General';
    }

    function extractAmount(text) {
      const cleaned = text.replace(/,/g, '');
      const kMatch = cleaned.match(/(?:₹|rs\.?|inr|\+|-)?\s*(\d+(?:\.\d+)?)\s*k\b/i);
      if (kMatch) return parseFloat(kMatch[1]) * 1000;

      const numMatch = cleaned.match(/(?:₹|rs\.?|inr|\+|-)?\s*(\d+(?:\.\d+)?)/i);
      if (numMatch) return parseFloat(numMatch[1]);
      return null;
    }

    function extractModeAndAccount(text) {
      const lower = text.toLowerCase();
      for (const acc of state.upiAccounts) {
        const escaped = acc.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (new RegExp(`\\b${escaped}\\b`, 'i').test(lower)) {
          return { mode: 'UPI', account: acc };
        }
      }
      if (/\b(cash|nagad|nakad|pocket|wallet|hand|notes|coin|coins)\b/i.test(lower)) {
        return { mode: 'CASH', account: null };
      }
      if (/\b(upi|gpay|google pay|phonepe|paytm|bhim|online|scan|qr|bank|transfer|neft|imps)\b/i.test(lower)) {
        return { mode: 'UPI', account: resolveUpiAccount(lower) };
      }
      return { mode: 'UPI', account: resolveUpiAccount(lower) };
    }

    function parseFriendNames(segment) {
      const tokens = segment
        .replace(/[^a-zA-Z\s,]/g, ' ')
        .split(/[\s,]+|\band\b|\baur\b|\bwith\b/i)
        .map(w => w.trim())
        .filter(Boolean);

      const names = [];
      const accNames = new Set(state.upiAccounts.map(a => a.name.toLowerCase()));
      for (const tok of tokens) {
        const low = tok.toLowerCase();
        if (tok.length >= 2 && !NON_FRIEND_WORDS.has(low) && !accNames.has(low)) {
          const cap = capitalize(tok);
          if (!names.includes(cap)) names.push(cap);
        }
      }
      return names;
    }

    function detectFriendPaidForUser(text) {
      const lower = text.toLowerCase();
      let payer = null;

      let m = lower.match(/\b(?:paid|given|spent|covered)\s+by\s+([a-zA-Z]+)/i);
      if (m && !NON_FRIEND_WORDS.has(m[1].toLowerCase())) payer = capitalize(m[1]);

      if (!payer) {
        m = lower.match(/\b([a-zA-Z]+)\s+(?:ne|paid|spent|gave|covered)\b/i);
        if (m && !NON_FRIEND_WORDS.has(m[1].toLowerCase())) {
          if (/\b(for me|mere liye|mere|my|both|dono|hum dono|shared|split|khana|lunch|dinner|chai|pizza|burger|bill|auto|ticket)\b/i.test(lower)) {
            payer = capitalize(m[1]);
          }
        }
      }

      if (!payer) return null;
      const isBoth = /\b(for both|both|dono|hum dono|split|shared|half|aadha)\b/i.test(lower);
      return { payer, isBoth };
    }

    function parseNaturalInput(raw) {
      const text = raw.trim();
      const lower = text.toLowerCase();

      const isBalanceQuery =
        /\b(bal|balance|kitna|kitne|bacha|bache|remaining|left|status|worth|mauke|moke|abhi ka|is mauke|is moke|total paisa|total paise)\b/i.test(lower) ||
        /(बैलेंस|बाकी|बचा|कितना|मौके|अभी)/i.test(text);

      if (isBalanceQuery && !extractAmount(text)) {
        return { intent: 'BALANCE' };
      }

      const accTransferMatch = lower.match(/\b(?:transfer|transferred|moved|sent|shifted)\b.*?\bfrom\s+([a-zA-Z0-9_-]+)\s+to\s+([a-zA-Z0-9_-]+)/i);
      if (accTransferMatch && state.upiAccounts.length > 1) {
        const amt = extractAmount(text);
        const fromAcc = state.upiAccounts.find(a => a.name.toLowerCase() === accTransferMatch[1].toLowerCase());
        const toAcc = state.upiAccounts.find(a => a.name.toLowerCase() === accTransferMatch[2].toLowerCase());
        if (amt && fromAcc && toAcc && fromAcc.id !== toAcc.id) {
          return { intent: 'ACC_TRANSFER', amount: amt, fromAcc, toAcc, note: text };
        }
      }

      if (/\b(atm|withdraw|withdrew|nikala|nikale|cash out|deposit|deposited|jama)\b/i.test(lower)) {
        const amt = extractAmount(text);
        if (amt && amt > 0) {
          const isDeposit = /\b(deposit|deposited|jama|cash to upi)\b/i.test(lower);
          const acc = resolveUpiAccount(lower);
          return {
            intent: 'TRANSFER',
            direction: isDeposit ? 'CASH_TO_UPI' : 'UPI_TO_CASH',
            amount: amt,
            account: acc,
            note: text
          };
        }
      }

      const settleBackMatch = lower.match(/\b(?:paid back|returned|settled|gave back|wapas diye|wapas kiya|paid to|sent to)\b/i);
      if (settleBackMatch) {
        const amt = extractAmount(text);
        const { mode, account } = extractModeAndAccount(text);
        const toMatch = lower.match(/\b(?:to|ko)\s+([a-zA-Z]+)/i);
        if (amt && amt > 0 && toMatch && !NON_FRIEND_WORDS.has(toMatch[1].toLowerCase())) {
          return {
            intent: 'SETTLE_PAYABLE',
            friend: capitalize(toMatch[1]),
            amount: amt,
            mode,
            account,
            note: text
          };
        }
      }

      const recvFromMatch = lower.match(/\b(?:received|got|took|mila|mile|wapas mile|paid back by)\b/i);
      if (recvFromMatch) {
        const amt = extractAmount(text);
        const { mode, account } = extractModeAndAccount(text);
        const fromMatch = lower.match(/\b(?:from|se|by)\s+([a-zA-Z]+)/i);
        if (amt && amt > 0 && fromMatch && !NON_FRIEND_WORDS.has(fromMatch[1].toLowerCase())) {
          return {
            intent: 'SETTLE_RECEIVABLE',
            friend: capitalize(fromMatch[1]),
            amount: amt,
            mode,
            account,
            note: text
          };
        }
      }

            const amount = extractAmount(text);
      if (!amount || amount <= 0) {
        return { intent: 'UNKNOWN' };
      }

      const friendPaid = detectFriendPaidForUser(text);
      if (friendPaid) {
        const myShare = friendPaid.isBoth ? Math.round((amount / 2) * 100) / 100 : amount;
        return {
          intent: 'FRIEND_PAID_FOR_ME',
          totalAmount: amount,
          myShare,
          payer: friendPaid.payer,
          isBoth: friendPaid.isBoth,
          category: inferCategory(text, 'DEBIT'),
          note: text
        };
      }

      let type = 'DEBIT';
      if (text.startsWith('+')) {
        type = 'CREDIT';
      } else if (text.startsWith('-')) {
        type = 'DEBIT';
      } else if (/\b(credit|credited|received|got|earned|salary|stipend|income|added|deposit|refund|cashback|mila|mile|aaye|aaya|prapt|jama)\b/i.test(lower)) {
        type = 'CREDIT';
      }

      const { mode, account } = extractModeAndAccount(text);

      let splitFriends = [];
      let exclusiveForFriend = false;

      if (type === 'DEBIT') {
        const lentMatch = lower.match(/\b(?:lent|loaned|gave|paid for|for)\s+([a-zA-Z\s,]+?)(?:\s+(?:only|sirf|ke liye|via|on|in|upi|cash|for|$))/i);
        if (/\b(lent|loaned|udhar diya|ke liye diya|for .* only|sirf .* ke liye)\b/i.test(lower) && lentMatch) {
          splitFriends = parseFriendNames(lentMatch[1]);
          if (splitFriends.length > 0) exclusiveForFriend = true;
        }

        if (splitFriends.length === 0) {
          const withMatch = text.match(/\b(?:with|split with|and|ke sath|ke saath)\s+([a-zA-Z\s,]+?)(?:\s+(?:via|by|through|on|in|for|upi|cash|$)|$)/i);
          if (withMatch) {
            splitFriends = parseFriendNames(withMatch[1]);
          }
        }
      }

      let myShare = amount;
      let perFriendShare = 0;

      if (type === 'DEBIT' && splitFriends.length > 0) {
        if (exclusiveForFriend) {
          myShare = 0;
          perFriendShare = Math.round((amount / splitFriends.length) * 100) / 100;
        } else {
          const totalPeople = splitFriends.length + 1;
          perFriendShare = Math.round((amount / totalPeople) * 100) / 100;
          myShare = Math.round((amount - perFriendShare * splitFriends.length) * 100) / 100;
        }
      }

      return {
        intent: 'TRANSACTION',
        type,
        amount,
        myShare,
        perFriendShare,
        splitFriends,
        exclusiveForFriend,
        mode,
        account,
        category: inferCategory(text, type),
        note: text
      };
    }

  Monotonic Revision : #${storageEngine.currentRev}
  FNV-1a Checksum    : ${storageEngine.lastChecksum}
  Layer 1 (Storage)  : ${storageEngine.l1Healthy ? 'ACTIVE' : 'DEGRADED'}
  Layer 2 (IDB)      : ${storageEngine.l2Healthy ? 'ACTIVE (2 Rolling Mirrors)' : 'UNAVAILABLE'}
  Last Synced At     : ${lastSyncStr}
  Multi-Tab Channel  : ${lifecycleSync && lifecycleSync.channel ? 'CONNECTED' : 'LOCAL'}`;
        printBlock(syncReport, 'info');
        playTone(740, 0.05);
        return;
      }

      if (lower === 'bal' || lower === 'balance' || lower === 'status') {
        printBalanceSheet();
        playTone(700, 0.04);
        return;
      }

      if (lower === 'dues' || lower === 'udhar' || lower === 'friends' || lower === 'split') {
        printDuesLedger();
        playTone(700, 0.04);
        return;
      }

      if (lower.startsWith('settle ')) {
        const parts = trimmed.split(/\s+/);
        const targetName = capitalize(parts[1] || '');
        const modeHint = (parts[2] || '').toUpperCase();
        const fKey = Object.keys(state.friends).find(k => k.toLowerCase() === targetName.toLowerCase());

        if (!fKey || Math.abs(state.friends[fKey]) < 0.01) {
          printLine(`[INFO] No pending balance with ${targetName || 'that friend'}.`, 'dim');
          return;
        }

        const netBal = state.friends[fKey];
        const absAmt = Math.abs(netBal);
        const mode = modeHint === 'CASH' ? 'CASH' : 'UPI';
        const acc = mode === 'UPI' ? resolveUpiAccount(lower) : null;

        if (netBal > 0) {
          if (mode === 'UPI') acc.balance += absAmt;
          else state.cashBalance += absAmt;
          state.friends[fKey] = 0;

          state.transactions.unshift({
            id: state.nextId++,
            ts: getTimestamp(),
            type: 'SETTLE_IN',
            amount: absAmt,
            myShare: 0,
            mode,
            accountName: acc ? acc.name : 'CASH',
            category: 'Settlement',
            note: `Settled receivable from ${fKey}`
          });

          await persistState('settle_in');
          printLine(`[SETTLED] ${fKey} paid ${formatMoney(absAmt)} -> ${mode === 'UPI' ? acc.name : 'CASH'}. Due is now ₹0.00.`, 'credit');
          playTone(880, 0.08, 'sine');
        } else {
          if (mode === 'UPI') acc.balance -= absAmt;
          else state.cashBalance -= absAmt;
          state.friends[fKey] = 0;

          state.transactions.unshift({
            id: state.nextId++,
            ts: getTimestamp(),
            type: 'SETTLE_OUT',
            amount: absAmt,
            myShare: 0,
            mode,
            accountName: acc ? acc.name : 'CASH',
            category: 'Settlement',
            note: `Paid payable to ${fKey}`
          });

          await persistState('settle_out');
          printLine(`[SETTLED] Paid ${formatMoney(absAmt)} to ${fKey} via ${mode === 'UPI' ? acc.name : 'CASH'}. Due is now ₹0.00.`, 'warn');
          playTone(520, 0.08, 'sine');
        }
        return;
      }

      if (lower === 'ls' || lower.startsWith('ls ') || lower === 'list' || lower === 'history') {
        const arg = lower.split(/\s+/)[1] || 'all';
        printTransactions(arg);
        playTone(620, 0.04);
        return;
      }

      if (lower === 'stats' || lower === 'summary') {
        printStats();
        playTone(680, 0.05);
        return;
      }

      if (lower.startsWith('rm ') || lower.startsWith('del ')) {
        const idNum = parseInt(lower.split(/\s+/)[1], 10);
        const idx = state.transactions.findIndex(t => t.id === idNum);
        if (idx === -1) {
          printLine(`[ERR] Transaction ID #${idNum} not found.`, 'debit');
          playTone(220, 0.1, 'sawtooth');
          return;
        }
        const tx = state.transactions[idx];
        const targetAcc = state.upiAccounts.find(a => a.name === tx.accountName) || state.upiAccounts[0];

        if (tx.type === 'DEBIT') {
          if (tx.mode === 'UPI' && targetAcc) targetAcc.balance += tx.amount;
          else if (tx.mode === 'CASH') state.cashBalance += tx.amount;
          if (tx.splitFriends && tx.perFriendShare) {
            tx.splitFriends.forEach(fn => {
              state.friends[fn] = Math.round(((state.friends[fn] || 0) - tx.perFriendShare) * 100) / 100;
            });
          }
        } else if (tx.type === 'FRIEND_PAID') {
          if (tx.payer && tx.myShare) {
            state.friends[tx.payer] = Math.round(((state.friends[tx.payer] || 0) + tx.myShare) * 100) / 100;
          }
        } else if (tx.type === 'CREDIT') {
          if (tx.mode === 'UPI' && targetAcc) targetAcc.balance -= tx.amount;
          else if (tx.mode === 'CASH') state.cashBalance -= tx.amount;
        } else if (tx.type === 'SETTLE_IN') {
          if (tx.mode === 'UPI' && targetAcc) targetAcc.balance -= tx.amount;
          else state.cashBalance -= tx.amount;
        } else if (tx.type === 'SETTLE_OUT') {
          if (tx.mode === 'UPI' && targetAcc) targetAcc.balance += tx.amount;
          else state.cashBalance += tx.amount;
        }

        state.transactions.splice(idx, 1);
        await persistState('delete_tx');
        printLine(`[OK] Removed #${idNum} and reverted balances.`, 'warn');
        playTone(420, 0.07);
        return;
      }

      if (lower === 'export') {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cashflow_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        printLine(`[OK] Exported ${state.transactions.length} transactions to JSON.`, 'credit');
        playTone(800, 0.06);
        return;
      }

      // --- NATURAL LANGUAGE PARSING ---
      const parsed = parseNaturalInput(trimmed);

      if (parsed.intent === 'BALANCE') {
        printBalanceSheet();
        playTone(700, 0.04);
        return;
      }

      if (parsed.intent === 'ACC_TRANSFER') {
        parsed.fromAcc.balance -= parsed.amount;
        parsed.toAcc.balance += parsed.amount;
        state.transactions.unshift({
          id: state.nextId++,
          ts: getTimestamp(),
          type: 'TRANSFER',
          amount: parsed.amount,
          myShare: 0,
          mode: 'UPI',
          accountName: `${parsed.fromAcc.name}->${parsed.toAcc.name}`,
          category: 'Transfer',
          note: parsed.note
        });
        await persistState('acc_transfer');
        printLine(`[TRANSFER] ${formatMoney(parsed.amount)} moved from ${parsed.fromAcc.name} -> ${parsed.toAcc.name}`, 'info');
        printLine(`  ${parsed.fromAcc.name}: ${formatMoney(parsed.fromAcc.balance)} | ${parsed.toAcc.name}: ${formatMoney(parsed.toAcc.balance)}`, 'dim');
        playTone(660, 0.06);
        return;
      }

      if (parsed.intent === 'TRANSFER') {
        const acc = parsed.account;
        if (parsed.direction === 'UPI_TO_CASH') {
          acc.balance -= parsed.amount;
          state.cashBalance += parsed.amount;
        } else {
          state.cashBalance -= parsed.amount;
          acc.balance += parsed.amount;
        }
        state.transactions.unshift({
          id: state.nextId++,
          ts: getTimestamp(),
          type: 'TRANSFER',
          amount: parsed.amount,
          myShare: 0,
          mode: 'UPI/CASH',
          accountName: acc.name,
          category: 'Transfer',
          note: parsed.note
        });
        await persistState('atm_transfer');
        printLine(`[TRANSFER] ${formatMoney(parsed.amount)} (${parsed.direction === 'UPI_TO_CASH' ? `${acc.name} -> CASH` : `CASH -> ${acc.name}`})`, 'warn');
        printLine(`  ${acc.name}: ${formatMoney(acc.balance)} | CASH: ${formatMoney(state.cashBalance)}`, 'dim');
        playTone(660, 0.06);
        return;
      }

      if (parsed.intent === 'SETTLE_PAYABLE') {
        const acc = parsed.account;
        if (parsed.mode === 'UPI') acc.balance -= parsed.amount;
        else state.cashBalance -= parsed.amount;

        state.friends[parsed.friend] = Math.round(((state.friends[parsed.friend] || 0) + parsed.amount) * 100) / 100;
        state.transactions.unshift({
          id: state.nextId++,
          ts: getTimestamp(),
          type: 'SETTLE_OUT',
          amount: parsed.amount,
          myShare: 0,
          mode: parsed.mode,
          accountName: acc ? acc.name : 'CASH',
          category: 'Settlement',
          note: parsed.note
        });
        await persistState('settle_payable');
        const rem = state.friends[parsed.friend];
        const statusStr = rem < 0 ? `Still Dena Hai: ${formatMoney(Math.abs(rem))}` : 'All Settled (₹0.00)';
        printLine(`[PAID BACK] Paid ${formatMoney(parsed.amount)} to ${parsed.friend} via ${acc ? acc.name : 'CASH'} | ${statusStr}`, 'warn');
        playTone(540, 0.08, 'sine');
        return;
      }

      if (parsed.intent === 'SETTLE_RECEIVABLE') {
        const acc = parsed.account;
        if (parsed.mode === 'UPI') acc.balance += parsed.amount;
        else state.cashBalance += parsed.amount;

        state.friends[parsed.friend] = Math.round(((state.friends[parsed.friend] || 0) - parsed.amount) * 100) / 100;
        state.transactions.unshift({
          id: state.nextId++,
          ts: getTimestamp(),
          type: 'SETTLE_IN',
          amount: parsed.amount,
          myShare: 0,
          mode: parsed.mode,
          accountName: acc ? acc.name : 'CASH',
          category: 'Settlement',
          note: parsed.note
        });
        await persistState('settle_receivable');
        const rem = state.friends[parsed.friend];
        const statusStr = rem > 0 ? `Still Lena Hai: ${formatMoney(rem)}` : 'All Settled (₹0.00)';
        printLine(`[RECEIVED] +${formatMoney(parsed.amount)} from ${parsed.friend} -> ${acc ? acc.name : 'CASH'} | ${statusStr}`, 'credit');
        playTone(880, 0.08, 'sine');
        return;
      }

      if (parsed.intent === 'FRIEND_PAID_FOR_ME') {
        state.friends[parsed.payer] = Math.round(((state.friends[parsed.payer] || 0) - parsed.myShare) * 100) / 100;
        const tx = {
          id: state.nextId++,
          ts: getTimestamp(),
          type: 'FRIEND_PAID',
          amount: parsed.totalAmount,
          myShare: parsed.myShare,
          payer: parsed.payer,
          mode: 'FRIEND',
          accountName: parsed.payer,
          category: parsed.category,
          note: parsed.note
        };
        state.transactions.unshift(tx);
        await persistState('friend_paid');

        const splitTag = parsed.isBoth ? ` (Split of ${formatMoney(parsed.totalAmount)})` : '';
        printLine(`[FRIEND PAID #${tx.id}] ${parsed.payer} paid for you | Your Expense: ${formatMoney(parsed.myShare)}${splitTag} [${parsed.category}]`, 'owe');
        printLine(`  -> Wallet untouched | Dena Hai to ${parsed.payer}: ${formatMoney(Math.abs(state.friends[parsed.payer]))}`, 'owe');
        playTone(460, 0.08, 'triangle');
        return;
      }

      if (parsed.intent === 'TRANSACTION') {
        const acc = parsed.account;
        const channelLabel = parsed.mode === 'UPI' ? acc.name : 'CASH';

        if (parsed.type === 'DEBIT') {
          if (parsed.mode === 'UPI') acc.balance -= parsed.amount;
          else state.cashBalance -= parsed.amount;
        } else {
          if (parsed.mode === 'UPI') acc.balance += parsed.amount;
          else state.cashBalance += parsed.amount;
        }

        if (parsed.splitFriends && parsed.splitFriends.length > 0) {
          parsed.splitFriends.forEach(fn => {
            state.friends[fn] = Math.round(((state.friends[fn] || 0) + parsed.perFriendShare) * 100) / 100;
          });
        }

        const tx = {
          id: state.nextId++,
          ts: getTimestamp(),
          type: parsed.type,
          amount: parsed.amount,
          myShare: parsed.type === 'DEBIT' ? parsed.myShare : 0,
          perFriendShare: parsed.perFriendShare,
          splitFriends: parsed.splitFriends,
          mode: parsed.mode,
          accountName: channelLabel,
          category: parsed.category,
          note: parsed.note
        };
        state.transactions.unshift(tx);
        await persistState('tx_entry');

        const sign = parsed.type === 'CREDIT' ? '+' : '-';
        const cls = parsed.type === 'CREDIT' ? 'credit' : 'debit';

        if (parsed.splitFriends && parsed.splitFriends.length > 0) {
          const fList = parsed.splitFriends.map(f => `${f} (+${formatMoney(parsed.perFriendShare)})`).join(', ');
          printLine(`[SPLIT #${tx.id}] ${sign}${formatMoney(parsed.amount)} via ${channelLabel} | Your Share: ${formatMoney(parsed.myShare)} [${parsed.category}]`, 'split');
          printLine(`  -> Lena Hai: ${fList}`, 'split');
        } else {
          printLine(`[LOGGED #${tx.id}] ${parsed.type} ${sign}${formatMoney(parsed.amount)} | ${channelLabel} | ${parsed.category}`, cls);
        }

        const balLeft = parsed.mode === 'UPI' ? acc.balance : state.cashBalance;
        printLine(`  ${channelLabel} Balance: ${formatMoney(balLeft)}`, 'dim');
        playTone(parsed.type === 'CREDIT' ? 860 : 390, 0.06, 'sine');
        return;
      }

      printLine(`[?] Samajh nahi aaya. Example: "50 chai upi", "200 pizza with sachin", ya "bal".`, 'warn');
      playTone(220, 0.1, 'sawtooth');
    }

    function printBalanceSheet() {
      let totalReceivable = 0;
      let totalPayable = 0;
      Object.values(state.friends).forEach(val => {
        if (val > 0) totalReceivable += val;
        if (val < 0) totalPayable += Math.abs(val);
      });

      const totalUpi = getTotalUpiBalance();
      const totalLiquid = totalUpi + state.cashBalance;
      const effectiveNet = totalLiquid + totalReceivable - totalPayable;

      let lines = `WALLET & UDHAR BALANCE SHEET\n\n`;
      state.upiAccounts.forEach((acc, i) => {
        const tag = state.upiAccounts.length > 1 && i === 0 ? ' [Primary]' : '';
        lines += `  UPI (${acc.name})${tag.padEnd(10)} : ${formatMoney(acc.balance)}\n`;
      });
      if (state.upiAccounts.length > 1) {
        lines += `  Total UPI Balance        : ${formatMoney(totalUpi)}\n`;
      }
      lines += `  Cash in Hand             : ${formatMoney(state.cashBalance)}\n`;
      lines += `  Total Liquid Cash+UPI    : ${formatMoney(totalLiquid)}\n\n`;
      lines += `  Friends Lena Hai (+)     : ${formatMoney(totalReceivable)}\n`;
      lines += `  Friends Dena Hai (-)     : ${formatMoney(totalPayable)}\n`;
      lines += `  Effective Net Worth      : ${formatMoney(effectiveNet)}`;
      printBlock(lines);
    }

    function printDuesLedger() {
      const entries = Object.entries(state.friends).filter(([_, amt]) => Math.abs(amt) >= 0.01);
      if (entries.length === 0) {
                printLine('Kisi dost ke saath koi udrhar baaki nahi hai (All settled).', 'dim', true);
        return;
      }
      let out = `FRIEND UDHAR LEDGER (LENA / DENA)\n\n`;
      entries.forEach(([name, amt]) => {
        if (amt > 0) {
          out += `  ${name.padEnd(14)} : LENA HAI  +${formatMoney(amt)}\n`;
        } else {
          out += `  ${name.padEnd(14)} : DENA HAI  -${formatMoney(Math.abs(amt))}\n`;
        }
      });
      out += `\nTip: Type "settle <name> upi" or "settle <name> cash" to clear.`;
      printBlock(out, 'split');
    }

    function printTransactions(filter) {
      let list = state.transactions;
      if (filter === 'upi') list = list.filter(t => t.mode === 'UPI');
      else if (filter === 'cash') list = list.filter(t => t.mode === 'CASH');

      if (list.length === 0) {
        printLine(`No transactions found (${filter.toUpperCase()}).`, 'dim', true);
        return;
      }

      let out = `TRANSACTION HISTORY (${filter.toUpperCase()} - ${list.length} entries)\n\n`;
      list.slice(0, 25).forEach(t => {
        const sign = t.type === 'CREDIT' || t.type === 'SETTLE_IN' ? '+' : '-';
        const amtStr = `${sign}${formatMoney(t.amount)}`.padStart(11);
        const chan = (t.accountName || t.mode).padEnd(8);
        const splitTag = t.type === 'FRIEND_PAID'
          ? ` [Paid by ${t.payer}]`
          : (t.splitFriends && t.splitFriends.length ? ` [Split: ${t.splitFriends.join(',')}]` : '');
        out += `#${String(t.id).padEnd(3)} ${t.ts.padEnd(12)} ${chan} ${amtStr}  ${t.category.padEnd(11)} ${t.note}${splitTag}\n`;
      });
      printBlock(out);
    }

    function printStats() {
      const debits = state.transactions.filter(t => (t.type === 'DEBIT' || t.type === 'FRIEND_PAID') && t.myShare > 0);
      if (debits.length === 0) {
        printLine('Abhi tak koi personal kharch record nahi hua hai.', 'dim', true);
        return;
      }

      const totalPersonal = debits.reduce((s, t) => s + t.myShare, 0);
      const map = {};
      debits.forEach(t => {
        map[t.category] = (map[t.category] || 0) + t.myShare;
      });

      const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
      let out = `PERSONAL EXPENSE BREAKDOWN (YOUR SHARE: ${formatMoney(totalPersonal)})\n\n`;
      sorted.forEach(([cat, amt]) => {
        const pct = Math.round((amt / totalPersonal) * 100);
        const filled = Math.round((pct / 100) * 18);
        const bar = '█'.repeat(filled) + '░'.repeat(18 - filled);
        out += `${cat.padEnd(13)} ${bar} ${String(pct).padStart(3)}%  ${formatMoney(amt)}\n`;
      });
      printBlock(out);
    }

    // --- HISTORY & KEYBOARD / TOUCH CONTROLS ---
    const cmdHistory = [];
    let historyIdx = -1;

    function navigateHistory(dir) {
      if (cmdHistory.length === 0) return;
      if (dir === 'UP') {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inputEl.value = cmdHistory[cmdHistory.length - 1 - historyIdx];
          playTone(540, 0.02);
        }
      } else {
        if (historyIdx > 0) {
          historyIdx--;
          inputEl.value = cmdHistory[cmdHistory.length - 1 - historyIdx];
          playTone(500, 0.02);
        } else if (historyIdx === 0) {
          historyIdx = -1;
          inputEl.value = '';
        }
      }
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    }

    function submitInput() {
      const val = inputEl.value;
      if (val.trim()) {
        cmdHistory.push(val);
        historyIdx = -1;
        runCommand(val);
      }
      inputEl.value = '';
      inputEl.focus();
    }

    function autoComplete() {
      const cur = inputEl.value.trim().toLowerCase();
      const cmds = ['bal', 'dues', 'settle ', 'ls', 'ls upi', 'ls cash', 'stats', 'setup', 'sync', 'help', 'clear', 'export', 'rm '];
      const match = cmds.find(c => c.startsWith(cur));
      if (match) {
        inputEl.value = match;
        playTone(760, 0.03);
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInput();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        navigateHistory('UP');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        navigateHistory('DOWN');
      } else if (e.key === 'Tab') {
        e.preventDefault();
        autoComplete();
      } else if (e.key.length === 1) {
        playTone(620 + Math.random() * 80, 0.015, 'square', 0.015);
      }
    });

    document.getElementById('btn-up').addEventListener('click', () => { navigateHistory('UP'); inputEl.focus(); });
    document.getElementById('btn-down').addEventListener('click', () => { navigateHistory('DOWN'); inputEl.focus(); });
    document.getElementById('btn-tab').addEventListener('click', () => { autoComplete(); inputEl.focus(); });
    document.getElementById('btn-clear').addEventListener('click', () => { runCommand('clear'); inputEl.focus(); });
    document.getElementById('btn-enter').addEventListener('click', () => { submitInput(); });

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        runCommand(btn.getAttribute('data-cmd'));
        inputEl.focus();
      });
    });

    document.querySelectorAll('[data-insert]').forEach(btn => {
      btn.addEventListener('click', () => {
        const snippet = btn.getAttribute('data-insert');
        inputEl.value = inputEl.value.replace(/\s+$/, '') + snippet;
        playTone(660, 0.025);
        inputEl.focus();
      });
    });

    outputEl.addEventListener('click', () => {
      if (window.getSelection().toString() === '') inputEl.focus();
    });

    // --- BOOT ---
    (async function boot() {
      state = await storageEngine.loadAndHeal();
      lifecycleSync = new LifecycleSync(
        storageEngine,
        () => state,
        (syncedState, newRev) => {
          state = syncedState;
          updateBadges();
          printLine(`[SYNC] Updated from parallel session (rev #${newRev}).`, 'info', true);
        },
        () => updateBadges()
      );
      updateBadges();
      const notice = storageEngine.recoveryLog.length > 0 ? storageEngine.recoveryLog.join(' | ') : '';
      printBanner(notice);
      inputEl.focus();
    })();
  </script>
</body>
</html>
